const theory=[
['PY-T001','What is Python and why is it commonly used in data analysis?','Easy','Python is a general-purpose language with a large data ecosystem. Analysts commonly use it because libraries such as Pandas and NumPy make data manipulation and numerical analysis concise.'],
['PY-T002','What is the difference between a list, tuple, set, and dictionary?','Easy','A list is ordered and mutable. A tuple is ordered and immutable. A set stores unique values. A dictionary stores key-value pairs.'],
['PY-T003','What is the difference between mutable and immutable objects?','Easy','Mutable objects can be changed after creation, such as lists and dictionaries. Immutable objects cannot be changed in place, such as strings, integers, and tuples.'],
['PY-T004','What is a variable in Python?','Easy','A variable is a name that refers to an object. Python determines the object type at runtime, so you do not need to declare a type before assigning a value.'],
['PY-T005','What is the difference between == and is?','Easy','== compares values. is checks whether two references point to the same object. For value comparison, normally use ==.'],
['PY-T006','What are Python functions?','Easy','A function is a reusable block of code defined with def. It can accept parameters and return a result with return.'],
['PY-T007','What is a lambda function?','Easy','A lambda is a small anonymous function, useful for short transformations such as sorting or applying a simple expression.'],
['PY-T008','What is list comprehension?','Easy','It is a compact way to create a list from an iterable, optionally applying a condition or transformation.'],
['PY-T009','What is exception handling in Python?','Easy','try/except lets you handle expected runtime errors without crashing the whole program. finally can be used for cleanup.'],
['PY-T010','What is the difference between append() and extend()?','Easy','append() adds one object as a single element. extend() adds each element from another iterable.'],
['PY-T011','What is NumPy?','Easy','NumPy provides fast multidimensional arrays and numerical operations. Pandas is built around array-like structures and uses NumPy concepts extensively.'],
['PY-T012','What is Pandas?','Easy','Pandas is a Python library for tabular and time-series data. Its main structures are Series and DataFrame.'],
['PY-T013','What is a Pandas Series?','Easy','A Series is a one-dimensional labeled array. It can contain values with an associated index.'],
['PY-T014','What is a Pandas DataFrame?','Easy','A DataFrame is a two-dimensional labeled table with rows and columns, similar to a spreadsheet or database result.'],
['PY-T015','How do you inspect the first and last rows of a DataFrame?','Easy','Use df.head() for the first rows and df.tail() for the last rows. You can pass a number such as df.head(10).'],
['PY-T016','What is the difference between loc and iloc?','Easy','loc uses labels or boolean conditions. iloc uses integer positions.'],
['PY-T017','How do you check DataFrame shape and column names?','Easy','Use df.shape for row and column counts and df.columns for the column labels.'],
['PY-T018','How do you check data types in Pandas?','Easy','Use df.dtypes to see each column type and df.info() for a compact schema and non-null summary.'],
['PY-T019','What is groupby in Pandas?','Easy','groupby splits data into groups and lets you calculate aggregations such as sum, mean, count, min, and max for each group.'],
['PY-T020','What is the difference between merge and concat?','Medium','merge combines tables using matching keys, similar to SQL JOIN. concat stacks or combines objects along an axis.'],
['PY-T021','How do you handle missing values in Pandas?','Easy','First inspect missingness with isna() or isnull(). Then choose dropna(), fillna(), forward fill, backward fill, or a business-specific replacement.'],
['PY-T022','What is the difference between dropna() and fillna()?','Easy','dropna() removes rows or columns containing missing values. fillna() replaces missing values with a specified value or strategy.'],
['PY-T023','How do you remove duplicate rows?','Easy','Use df.drop_duplicates(). You can specify subset= to define which columns determine a duplicate.'],
['PY-T024','How do you filter rows in Pandas?','Easy','Use boolean conditions such as df[df["salary"] > 50000]. Combine conditions with & and | and wrap each condition in parentheses.'],
['PY-T025','What does apply() do in Pandas?','Medium','apply() applies a function across a Series or along a DataFrame axis. Prefer vectorized operations when available because they are usually clearer and faster.'],
['PY-T026','What is vectorization in Pandas?','Medium','Vectorization means performing operations on whole arrays or columns instead of looping row by row. It usually improves performance and readability.'],
['PY-T027','How do you sort a DataFrame?','Easy','Use df.sort_values("salary", ascending=False). Multiple columns can be supplied as a list.'],
['PY-T028','How do you rename columns?','Easy','Use df.rename(columns={"old":"new"}) or assign a complete list to df.columns.'],
['PY-T029','How do you convert a column to datetime?','Easy','Use pd.to_datetime(df["date"], errors="coerce") and then use the .dt accessor for date components.'],
['PY-T030','What is a pivot table in Pandas?','Medium','pivot_table summarizes data across one or more dimensions, often using an aggregation such as sum or mean.'],
['PY-T031','What is the difference between map(), apply(), and DataFrame.map()?','Medium','Series.map is mainly for mapping or element-wise transformation of a Series. apply can work across a Series or DataFrame axis. DataFrame.map performs element-wise transformation across a DataFrame.'],
['PY-T032','How do you select columns from a DataFrame?','Easy','Use df["column"] for one column or df[["column1","column2"]] for multiple columns.'],
['PY-T033','What is an index in Pandas?','Easy','The index labels rows. It can be a simple integer index or meaningful labels such as dates or IDs.'],
['PY-T034','Why should you avoid chained assignment in Pandas?','Medium','Chained assignment can make it unclear whether you are modifying the original DataFrame or a temporary object. Use .loc for explicit assignment.'],
['PY-T035','How do you calculate a percentage change?','Easy','For a Series, use pct_change(). It calculates the relative change from the previous observation.'],
['PY-T036','How do you calculate cumulative totals?','Easy','Use cumsum(), for example df["sales"].cumsum().'],
['PY-T037','How do you find the top N rows?','Easy','Use sort_values(...).head(N) or nlargest(N, column) depending on the requirement.'],
['PY-T038','How do you find unique values and their counts?','Easy','Use Series.unique() for unique values and Series.value_counts() for frequency counts.'],
['PY-T039','What is an inner merge versus a left merge in Pandas?','Medium','An inner merge keeps matching keys in both DataFrames. A left merge keeps every row from the left DataFrame and adds matching right-side data.'],
['PY-T040','How would you optimize a slow Pandas workflow?','Hard','Inspect the bottleneck first. Prefer vectorized operations, select only required columns, use efficient dtypes, avoid unnecessary copies and row-wise apply, and process large data in chunks when appropriate.'],
['PY-T041','How do you detect outliers using IQR?','Medium','Calculate Q1 and Q3, compute IQR = Q3-Q1, and flag values below Q1-1.5*IQR or above Q3+1.5*IQR.'],
['PY-T042','How do you create a new column from existing columns?','Easy','Assign an expression such as df["revenue"] = df["price"] * df["quantity"].'],
['PY-T043','How do you group by multiple columns?','Easy','Pass a list to groupby, for example df.groupby(["department","city"])["salary"].mean().'],
['PY-T044','How do you reset an index after groupby?','Easy','Use reset_index() to turn grouped index levels back into regular columns.'],
['PY-T045','How do you read a CSV file with Pandas?','Easy','Use pd.read_csv("file.csv"). For production work, specify relevant dtypes, dates, missing-value rules, or selected columns when useful.'],
['PY-T046','How do you export a DataFrame to CSV?','Easy','Use df.to_csv("output.csv", index=False) when the DataFrame index should not become an extra column.'],
['PY-T047','How do you combine two DataFrames with different row sets?','Medium','Use merge with the required join type, or concat when you are stacking compatible tables.'],
['PY-T048','How do you standardize inconsistent text values such as "Delhi", "delhi", and " Delhi "?','Medium','Normalize first, for example with astype("string").str.strip().str.lower(), then map values if business-specific standardization is needed.'],
['PY-T049','What is a good workflow for a messy analytics dataset?','Medium','Inspect schema and missingness, standardize types, clean duplicates and invalid values, validate business rules, then transform and analyze. Keep the raw data unchanged.'],
['PY-T050','How would you explain Python analysis to a non-technical interviewer?','Medium','Start with the business question, describe the data preparation briefly, explain the analytical method in plain language, then state the result and business implication.']

let mode='theory', current=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function list(){return mode==='theory'?theory:practical}
function renderNav(){
  const search=($('search').value||'').toLowerCase().trim();
  const diff=$('difficulty').value;
  const arr=list().filter(q=>(!search||q[1].toLowerCase().includes(search)||q[0].toLowerCase().includes(search))&&(diff==='All'||q[2]===diff));
  $('stats').textContent=(mode==='theory'?'Theory: ':'Practical: ')+arr.length+' questions';
  $('nav').innerHTML='';
  if(!arr.length){current=null;$('page').innerHTML='<div class="card"><div class="question">No questions match your filter.</div><p class="meta">Try All difficulty or clear the search box.</p></div>';return;}
  arr.forEach(q=>{const b=document.createElement('button');b.className='qbtn'+(current===q[0]?' active':'');b.textContent=q[0]+' · '+q[1];b.onclick=()=>show(q[0]);$('nav').appendChild(b)});
  if(!arr.some(q=>q[0]===current))current=arr[0][0];
  show(current);
}
function show(id){
  const q=list().find(x=>x[0]===id); if(!q)return;
  current=id;
  document.querySelectorAll('.qbtn').forEach(b=>b.classList.toggle('active',b.textContent.startsWith(id+' · ')));
  $('title').textContent=q[0]+' · '+q[1];
  if(mode==='theory'){
    $('subtitle').textContent='Detailed Python and Pandas explanations in simple interview language.';
    $('page').innerHTML='<div class="card"><span class="badge">Python Theory</span><span class="badge">'+q[2]+'</span><div class="question">🐍 '+esc(q[1])+'</div></div><div class="card"><h3>💡 Detailed answer</h3><div class="answer">'+esc(q[3])+'</div></div><div class="card"><h3>🎯 Interview tip</h3><div class="tip">Explain the concept in simple words first, then give a short example. For Data Analyst interviews, connect the concept to data cleaning, transformation, automation, or analysis when relevant.</div></div>';
  }else{
    $('subtitle').textContent='Write Python first, run it, check your answer, then compare with the solution.';
    $('page').innerHTML='<div class="card"><span class="badge">Practical Python</span><span class="badge">'+q[2]+'</span><div class="question">🐍 '+esc(q[1])+'</div><p class="meta">Write your code before looking at the solution.</p></div><div class="card"><h3>🤔 Think first</h3><div class="hint">Identify the input, the transformation, and the expected output before coding.</div></div><div class="card"><h3>✍️ Write your Python</h3><textarea id="editor" class="editor"># Write your solution here</textarea><div class="buttons"><button class="btn run" id="runBtn">▶ Run Python</button><button class="btn check" id="checkBtn">✓ Check Answer</button><button class="btn show" id="showBtn">Show Correct Code</button><button class="btn clear" id="clearBtn">Clear</button></div><div id="result"></div></div><div class="card"><h3>💡 Solution</h3><pre class="code" id="solution">Click “Show Correct Code” when you are ready.</pre></div>';
    $('runBtn').onclick=runPython;$('checkBtn').onclick=checkPython;$('showBtn').onclick=showSolution;$('clearBtn').onclick=()=>{$('editor').value='';$('result').innerHTML=''};
  }
}
let pyodide=null, loading=null;
async function getPyodide(){
  if(pyodide)return pyodide;
  if(!loading){loading=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js';s.onload=async()=>{try{pyodide=await loadPyodide();resolve(pyodide)}catch(e){reject(e)}};s.onerror=reject;document.head.appendChild(s)})}
  return loading;
}
async function runPython(){const out=$('result');out.innerHTML='<div class="result">Loading Python runtime...</div>';try{const p=await getPyodide();let output='';p.setStdout({batched:s=>output+=s});await p.runPythonAsync($('editor').value);out.innerHTML='<div class="result ok"><b>Output:</b><pre>'+esc(output||'(no printed output)')+'</pre></div>'}catch(e){out.innerHTML='<div class="result err"><b>Python error:</b><pre>'+esc(e.message||e)+'</pre></div>'}}
function showSolution(){const q=practical.find(x=>x[0]===current);$('solution').textContent=q?q[3]:''}
function norm(s){return String(s).replace(/\s+/g,' ').trim().toLowerCase()}
function conceptuallyCorrect(q, code){
  const id=q[0], t=q[1].toLowerCase(), c=code.toLowerCase();
  const has=(...patterns)=>patterns.some(p=>p.test(c));

  const rules={
    'PY-P001':[/for\\s+\\w+\\s+in/,/print\\s*\\(/],
    'PY-P002':[/\\bsum\\s*\\(/,/total\\s*\\+=/,/for\\s+\\w+\\s+in/],
    'PY-P003':[/\\bmax\\s*\\(/,/sorted\\s*\\(/,/for\\s+\\w+\\s+in/],
    'PY-P004':[/%\\s*2\\s*==\\s*0/,/even/],
    'PY-P005':[/dict\\.fromkeys/,/set\\s*\\(/,/drop_duplicates/,/unique/],
    'PY-P006':[/\\.items\\s*\\(/,/salary/,/>\\s*50000/],
    'PY-P007':[/\\[.*for.*in.*range/,/\\*\\*\\s*2/,/x\\s*\\*\\s*x/],
    'PY-P008':[/sum\\s*\\(/,/len\\s*\\(/,/mean\\s*\\(/],
    'PY-P009':[/try\\s*:/,/zeroDivisionError/],
    'PY-P010':[/dataframe/,/pd\\.dataframe/],
    'PY-P011':[/\\[.*salary.*\\]/,/salary/],
    'PY-P012':[/salary/,/>\\s*60000/,/query\\s*\\(/],
    'PY-P013':[/sort_values/,/sorted\\s*\\(/],
    'PY-P014':[/\\.mean\\s*\\(/,/sum\\s*\\(/],
    'PY-P015':[/groupby/,/sales/],
    'PY-P016':[/groupby/,/salary/],
    'PY-P017':[/value_counts/,/groupby/],
    'PY-P018':[/fillna/,/median/,/isna/],
    'PY-P019':[/dropna/,/subset/],
    'PY-P020':[/drop_duplicates/,/duplicated/],
    'PY-P021':[/rename/,/annual_salary/],
    'PY-P022':[/to_datetime/,/datetime/],
    'PY-P023':[/\\.dt\\.year/,/year/],
    'PY-P024':[/revenue/,/price.*\\*.*quantity/,/quantity.*\\*.*price/],
    'PY-P025':[/nlargest/,/sort_values/,/head\\s*\\(/],
    'PY-P026':[/merge/,/customer_id/],
    'PY-P027':[/merge/,/how\\s*=\\s*[\"']left/],
    'PY-P028':[/groupby/,/merge/,/sum/],
    'PY-P029':[/merge/,/left_only/,/isna/],
    'PY-P030':[/to_period/,/groupby/,/dt\\.month/],
    'PY-P031':[/shift/,/previous_sales/,/-/],
    'PY-P032':[/cumsum/,/running_total/],
    'PY-P033':[/pct_change/,/shift/],
    'PY-P034':[/groupby/,/idxmax/,/max/],
    'PY-P035':[/groupby/,/rank/],
    'PY-P036':[/quantile/,/iqr/,/1\\.5/],
    'PY-P037':[/str\\.strip/,/upper/,/lower/],
    'PY-P038':[/pivot_table/,/pivot/],
    'PY-P039':[/duplicated/,/customer_id/],
    'PY-P040':[/total_sales/,/average_order_value/,/order_count/,/nunique/],
  };

  if(rules[id]) return has(...rules[id]);

  // For later questions, use distinctive operations from the task wording.
  if(t.includes('dictionary') && t.includes('frequency')) return has(/split\\s*\\(/,/get\\s*\\(/,/counts/);
  if(t.includes('second-largest')) return has(/sorted\\s*\\(/,/set\\s*\\(/,/reverse/);
  if(t.includes('flatten')) return has(/for .* in .*for/,/extend\\s*\\(/,/chain/);
  if(t.includes('vowels')) return has(/aeiou/,/lower\\s*\\(/,/sum\\s*\\(/);
  if(t.includes('department average')) return has(/groupby/,/transform/,/mean/);
  if(t.includes('second-highest salary')) return has(/groupby/,/rank/,/dense/);
  if(t.includes('rolling average')) return has(/rolling/,/mean/);
  if(t.includes('first purchase date')) return has(/groupby/,/min/);
  if(t.includes('contribution to total revenue')) return has(/sum/,/revenue/,/100/);
  if(t.includes('top product by revenue')) return has(/groupby/,/idxmax/,/nlargest/);
  if(t.includes('previous month')) return has(/shift/,/groupby/);
  if(t.includes('above the overall average')) return has(/groupby/,/mean/,/>/);
  if(t.includes('sudden sales drop')) return has(/shift/,/0\\.7/,/sales/);
  if(t.includes('validates required')) return has(/columns/,/missing/,/for/);
  if(t.includes('data migration')) return has(/!=/,/old_value/,/new_value/);
  if(t.includes('data-quality report')) return has(/isna/,/duplicated/,/len/);
  if(t.includes('chunks')) return has(/chunksize/,/read_csv/);
  if(t.includes('kpi')) return has(/sum/,/nunique/,/orders/,/visits/);
  return false;
}

async function checkPython(){
  const q=practical.find(x=>x[0]===current); if(!q)return;
  const out=$('result');
  out.innerHTML='<div class="result">Running your code to check the answer...</div>';
  try{
    const p=await getPyodide();
    let user='';
    p.setStdout({batched:s=>user+=s});
    await p.runPythonAsync($('editor').value);

    let expected='';
    p.setStdout({batched:s=>expected+=s});
    await p.runPythonAsync(q[3]);

    const exact=norm(user)===norm(expected);
    const concept=conceptuallyCorrect(q,$('editor').value);

    if(exact){
      out.innerHTML='<div class="result ok">✅ Correct answer. Your output matches the reference solution.</div>';
    }else if(concept){
      out.innerHTML='<div class="result ok">✅ Correct approach. Your code solves the task. Your output can be different because you used different sample values. That is valid.</div>';
    }else{
      out.innerHTML='<div class="result err">❌ The code ran, but the checking logic could not confirm the required approach. If you changed the sample data, that is fine, but make sure your code still performs the operation asked in the question.</div>';
    }
  }catch(e){
    out.innerHTML='<div class="result err">❌ '+esc(e.message||e)+'</div>';
  }
}
