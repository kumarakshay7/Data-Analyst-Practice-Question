<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#697386;--line:#e2e7ef;--dark:#101827;--dark2:#1b2638;--blue:#2563eb;--green:#15803d;--red:#b91c1c;--yellow:#a16207}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:4px 10px 18px;border-bottom:1px solid #2b374a}.brand h1{font-size:19px;margin:0 0 7px}.brand p{font-size:12px;color:#aeb8c8;margin:0}.progress{padding:15px 10px}.bar{height:7px;background:#2a3548;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#60a5fa;width:0}.progress p{font-size:11px;color:#aeb8c8}.label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#7f8ca2;padding:8px 10px 4px}.filter{padding:4px 10px 10px;display:flex;gap:6px;flex-wrap:wrap}.filter button{border:1px solid #344157;background:#182235;color:#cdd5e2;border-radius:7px;padding:6px 8px;font-size:11px;cursor:pointer}.filter button.active{background:#2b64d8;color:#fff}.qbtn{width:100%;border:0;background:transparent;color:#cbd4e2;text-align:left;border-radius:8px;padding:10px;margin:2px 0;cursor:pointer;font-size:12px;line-height:1.35}.qbtn:hover,.qbtn.active{background:var(--dark2);color:#fff}.main{padding:30px;max-width:1200px;width:100%;margin:auto}.header{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px}.header h2{margin:0 0 6px;font-size:25px}.header p{margin:0;color:var(--muted);font-size:13px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px;height:max-content}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:21px;margin:14px 0;box-shadow:0 8px 24px #1018270f}.card h3{font-size:16px;margin:0 0 10px}.question{font-size:18px;font-weight:700}.text{font-size:14px;line-height:1.65}.what{background:#f8fafc;border:1px solid var(--line);padding:13px;border-radius:9px;font-size:13px;line-height:1.6}.schema{background:#0b1220;color:#dce5f4;border-radius:9px;padding:14px;overflow:auto;font:13px/1.5 Consolas,monospace;white-space:pre-wrap}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}.table th{background:#f8fafc}.hint{border-left:4px solid #eab308;background:#fff9df;padding:11px 13px;margin:8px 0;border-radius:5px;font-size:13px}.editor{width:100%;min-height:230px;resize:vertical;background:#0b1220;color:#e8eef8;border:0;border-radius:9px;padding:16px;font:14px/1.55 Consolas,monospace}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.run{background:#0f766e;color:#fff}.check{background:var(--blue);color:#fff}.secondary{background:#e9eef6;color:#172033}.success{background:#ecfdf3;border:1px solid #86efac;color:#166534;border-radius:8px;padding:12px;font-size:13px}.error{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;border-radius:8px;padding:12px;font-size:13px}.result table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}.result th,.result td{padding:8px;border:1px solid var(--line);text-align:left}.result th{background:#f8fafc}.hidden{display:none}.solution pre{background:#0b1220;color:#e8eef8;padding:15px;border-radius:9px;overflow:auto;font:13px/1.55 Consolas,monospace}.interview{background:#f0f7ff;border:1px solid #bfdbfe;border-radius:9px;padding:13px;line-height:1.65;font-size:13px}.notice{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:8px;padding:12px;font-size:13px}@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.main{padding:18px}.header{flex-direction:column}}

<body>
<div class="app"><aside class="sidebar"><div class="brand"><h1>SQL DATA ANALYST<br>INTERVIEW PRACTICE</h1><p>Think → Write → Run → Check → Learn</p></div><div class="progress"><div class="bar"><span id="bar"></span></div><p id="progress">0 / 10 completed</p></div><div class="label">Difficulty</div><div class="filter"><button class="active" data-f="All">All</button><button data-f="Easy">🟢 Easy</button><button data-f="Medium">🟡 Medium</button><button data-f="Hard">🔴 Hard</button></div><div class="label">Questions</div><div id="nav"></div></aside><main class="main"><div class="header"><div><h2 id="title"></h2><p>Write your query before looking at the solution.</p></div><div class="pill" id="pill"></div></div><div id="page"></div></main></div>
<script>
let SQLLib=null,db=null,current=0,filter='All';
const completed=JSON.parse(localStorage.getItem('sqlPracticeCompleted')||'[]');
const Q=[
{id:'Q001',t:'Salary History: salary never decreases',l:'Medium',topic:'LAG / Window Functions',q:'We have a salary history table. Employees receive salary changes over time. Find employees whose salary never decreased.',simple:'Compare every salary with the previous salary for that employee. If there is even one decrease, exclude that employee.',schema:'salary_history(employee_id, effective_date, salary)',cols:['employee_id','effective_date','salary'],rows:[[101,'2022-01-01',50000],[101,'2023-01-01',55000],[101,'2024-01-01',60000],[102,'2022-01-01',50000],[102,'2023-01-01',60000],[102,'2024-01-01',55000],[103,'2022-01-01',45000],[103,'2023-01-01',45000],[103,'2024-01-01',50000]],setup:"CREATE TABLE salary_history(employee_id INTEGER,effective_date TEXT,salary INTEGER);INSERT INTO salary_history VALUES(101,'2022-01-01',50000),(101,'2023-01-01',55000),(101,'2024-01-01',60000),(102,'2022-01-01',50000),(102,'2023-01-01',60000),(102,'2024-01-01',55000),(103,'2022-01-01',45000),(103,'2023-01-01',45000),(103,'2024-01-01',50000);",sql:"WITH salary_check AS (SELECT employee_id,effective_date,salary,LAG(salary) OVER(PARTITION BY employee_id ORDER BY effective_date) previous_salary FROM salary_history) SELECT employee_id FROM salary_check GROUP BY employee_id HAVING SUM(CASE WHEN previous_salary IS NOT NULL AND salary<previous_salary THEN 1 ELSE 0 END)=0;",out:[['101'],['103']],h1:'How can you get the previous salary for the same employee?',h2:'Use LAG(), PARTITION BY employee_id and ORDER BY effective_date.',exp:'LAG gives the previous salary. We compare the current salary with it. The CASE counts salary decreases, and HAVING = 0 keeps employees with no decrease.',ans:'I use LAG because I need the previous salary for each employee. I partition by employee and order by effective date, then check whether the current salary is lower than the previous salary.',follow:'What happens to the first salary record for each employee?'},
{id:'Q002',t:'Five consecutive login days',l:'Medium',topic:'ROW_NUMBER / Gaps & Islands',q:'Find users who logged in on at least 5 consecutive days.',simple:'Treat multiple logins on the same date as one day, then find groups of consecutive dates.',schema:'login(userid, logindate)',cols:['userid','logindate'],rows:[[101,'2026-09-01'],[101,'2026-09-02'],[101,'2026-09-03'],[101,'2026-09-04'],[101,'2026-09-05'],[102,'2026-09-01'],[102,'2026-09-02'],[102,'2026-09-04'],[103,'2026-09-10'],[103,'2026-09-11'],[103,'2026-09-12'],[103,'2026-09-13'],[103,'2026-09-14']],setup:"CREATE TABLE login(userid INTEGER,logindate TEXT);INSERT INTO login VALUES(101,'2026-09-01'),(101,'2026-09-02'),(101,'2026-09-03'),(101,'2026-09-04'),(101,'2026-09-05'),(102,'2026-09-01'),(102,'2026-09-02'),(102,'2026-09-04'),(103,'2026-09-10'),(103,'2026-09-11'),(103,'2026-09-12'),(103,'2026-09-13'),(103,'2026-09-14');",sql:"WITH d AS(SELECT DISTINCT userid,logindate FROM login),r AS(SELECT userid,logindate,ROW_NUMBER() OVER(PARTITION BY userid ORDER BY logindate) rn FROM d),g AS(SELECT userid,logindate,date(logindate,printf('-%d day',rn)) grp FROM r) SELECT userid FROM g GROUP BY userid,grp HAVING COUNT(*)>=5;",out:[['101'],['103']],h1:'Remove duplicate login dates first.',h2:'Use ROW_NUMBER() and date arithmetic to create a group for consecutive dates.',exp:'After duplicates are removed, ROW_NUMBER gives 1,2,3... for each user. Subtracting the row number from consecutive dates makes them share the same group. A group with 5 rows means 5 consecutive days.',ans:'I remove duplicate login dates first. Then I use ROW_NUMBER and date arithmetic to group consecutive dates, and finally keep groups with at least five days.',follow:'Why do we need DISTINCT before ROW_NUMBER?'},
{id:'Q003',t:'Customers who purchased every Electronic product',l:'Medium',topic:'JOIN / GROUP BY / HAVING',q:'Find customers who purchased every product in the Electronic category.',simple:'Count unique Electronic products bought by each customer and compare that count with the total number of Electronic products.',schema:'orders(customer_id, product_id)\nproducts(product_id, category)',cols:['customer_id','product_id'],rows:[[101,'E1'],[101,'E2'],[101,'E3'],[102,'E1'],[102,'E2'],[103,'E1'],[103,'E2'],[103,'E3'],[103,'E3']],setup:"CREATE TABLE products(product_id TEXT,category TEXT);CREATE TABLE orders(customer_id INTEGER,product_id TEXT);INSERT INTO products VALUES('E1','Electronic'),('E2','Electronic'),('E3','Electronic'),('F1','Furniture');INSERT INTO orders VALUES(101,'E1'),(101,'E2'),(101,'E3'),(102,'E1'),(102,'E2'),(103,'E1'),(103,'E2'),(103,'E3'),(103,'E3');",sql:"SELECT o.customer_id FROM orders o JOIN products p ON o.product_id=p.product_id WHERE p.category='Electronic' GROUP BY o.customer_id HAVING COUNT(DISTINCT o.product_id)=(SELECT COUNT(DISTINCT product_id) FROM products WHERE category='Electronic');",out:[['101'],['103']],h1:'Join orders to products and keep only Electronic products.',h2:'COUNT(DISTINCT) for each customer and compare with the total Electronic product count.',exp:'The join identifies the category. COUNT(DISTINCT) prevents duplicate purchases being counted twice. Equal counts mean the customer bought every Electronic product.',ans:'I join orders with products, filter Electronic products, count distinct products for each customer, and compare that count with the total number of Electronic products.',follow:'Why is COUNT(DISTINCT) important here?'},
{id:'Q004',t:'Employees earning more than their manager',l:'Easy',topic:'SELF JOIN',q:'Find employees whose salary is higher than their manager salary.',simple:'Employee and manager records are in the same table, so use two copies of the table.',schema:'employees(employee_id, employee_name, manager_id, salary)',cols:['employee_id','employee_name','manager_id','salary'],rows:[[1,'Amit',null,120000],[2,'Ravi',1,135000],[3,'Neha',1,110000],[4,'Priya',5,90000],[5,'Vikram',null,95000],[6,'Arjun',5,85000]],setup:"CREATE TABLE employees(employee_id INTEGER,employee_name TEXT,manager_id INTEGER,salary INTEGER);INSERT INTO employees VALUES(1,'Amit',NULL,120000),(2,'Ravi',1,135000),(3,'Neha',1,110000),(4,'Priya',5,90000),(5,'Vikram',NULL,95000),(6,'Arjun',5,85000);",sql:"SELECT e.employee_name,e.salary,m.employee_name manager_name,m.salary manager_salary FROM employees e JOIN employees m ON e.manager_id=m.employee_id WHERE e.salary>m.salary;",out:[['Ravi','135000','Amit','120000']],h1:'Employee and manager are in the same table.',h2:'Join employees to itself using e.manager_id = m.employee_id.',exp:'This is a self join. The first copy represents the employee and the second copy represents the manager. Then compare salaries.',ans:'I use a self join because employee and manager information is in the same table. Then I compare the employee salary with the manager salary.',follow:'Why would an INNER JOIN be enough here?'},
{id:'Q005',t:'Third highest salary',l:'Medium',topic:'DENSE_RANK',q:'Find employees with the third highest distinct salary.',simple:'Rank salaries from highest to lowest. DENSE_RANK keeps tied salaries at the same rank.',schema:'employees(employee_id, employee_name, salary)',cols:['employee_id','employee_name','salary'],rows:[[1,'Amit',120000],[2,'Ravi',135000],[3,'Neha',110000],[4,'Priya',90000],[5,'Vikram',95000],[6,'Arjun',85000]],setup:"CREATE TABLE employees(employee_id INTEGER,employee_name TEXT,salary INTEGER);INSERT INTO employees VALUES(1,'Amit',120000),(2,'Ravi',135000),(3,'Neha',110000),(4,'Priya',90000),(5,'Vikram',95000),(6,'Arjun',85000);",sql:"SELECT employee_id,employee_name,salary FROM(SELECT employee_id,employee_name,salary,DENSE_RANK() OVER(ORDER BY salary DESC) rnk FROM employees)t WHERE rnk=3;",out:[['3','Neha','110000']],h1:'Rank salaries from highest to lowest.',h2:'Use DENSE_RANK so tied salaries share the same rank.',exp:'DENSE_RANK gives equal salaries the same rank and does not skip the next rank. Then filter rank 3.',ans:'I use DENSE_RANK because the question asks for the third highest distinct salary and ties should receive the same rank.',follow:'What changes if the interviewer asks for the third row instead?'},
{id:'Q006',t:'Find duplicate customer records',l:'Easy',topic:'GROUP BY / HAVING',q:'Find duplicate customer email addresses.',simple:'Group customers by email and keep emails that occur more than once.',schema:'customers(customer_id, name, email)',cols:['customer_id','name','email'],rows:[[1,'Amit','amit@mail.com'],[2,'Ravi','ravi@mail.com'],[3,'Amit Kumar','amit@mail.com'],[4,'Neha','neha@mail.com']],setup:"CREATE TABLE customers(customer_id INTEGER,name TEXT,email TEXT);INSERT INTO customers VALUES(1,'Amit','amit@mail.com'),(2,'Ravi','ravi@mail.com'),(3,'Amit Kumar','amit@mail.com'),(4,'Neha','neha@mail.com');",sql:"SELECT email,COUNT(*) duplicate_count FROM customers GROUP BY email HAVING COUNT(*)>1;",out:[['amit@mail.com','2']],h1:'Group the rows by the field that should be unique.',h2:'Use HAVING COUNT(*) > 1 to keep only repeated values.',exp:'GROUP BY creates one group per email. HAVING filters those groups after aggregation.',ans:'I group customers by email and use HAVING COUNT(*) greater than one to identify duplicate email addresses.',follow:'How would you delete duplicates while keeping the lowest customer_id?'},
{id:'Q007',t:'Top 2 customers in each category',l:'Medium',topic:'ROW_NUMBER / PARTITION BY',q:'Find the top 2 customers by total order amount within each product category.',simple:'First aggregate sales by customer and category, then rank customers inside each category.',schema:'orders(customer_id, category, amount)',cols:['customer_id','category','amount'],rows:[[101,'Electronics',500],[101,'Electronics',300],[102,'Electronics',900],[103,'Electronics',700],[101,'Furniture',1000],[102,'Furniture',600],[103,'Furniture',800]],setup:"CREATE TABLE orders(customer_id INTEGER,category TEXT,amount INTEGER);INSERT INTO orders VALUES(101,'Electronics',500),(101,'Electronics',300),(102,'Electronics',900),(103,'Electronics',700),(101,'Furniture',1000),(102,'Furniture',600),(103,'Furniture',800);",sql:"WITH totals AS(SELECT customer_id,category,SUM(amount) total_amount FROM orders GROUP BY customer_id,category),r AS(SELECT *,ROW_NUMBER() OVER(PARTITION BY category ORDER BY total_amount DESC) rn FROM totals) SELECT customer_id,category,total_amount FROM r WHERE rn<=2 ORDER BY category,total_amount DESC;",out:[['102','Electronics','900'],['103','Electronics','700'],['101','Furniture','1000'],['103','Furniture','800']],h1:'Aggregate order amount before ranking.',h2:'Use ROW_NUMBER() PARTITION BY category ORDER BY total_amount DESC.',exp:'The first step gives one total per customer/category. The window function ranks customers separately inside each category.',ans:'I first calculate total order amount for each customer and category. Then I use ROW_NUMBER partitioned by category and keep ranks 1 and 2.',follow:'When would you use DENSE_RANK instead of ROW_NUMBER?'},
{id:'Q008',t:'Cumulative salary by department',l:'Medium',topic:'SUM OVER / Running Total',q:'For employees who joined in the last 30 days, calculate cumulative salary department-wise ordered by joining date.',simple:'Filter recent employees first, then use a running SUM partitioned by department.',schema:'employees(employee_id, department, joining_date, salary)',cols:['employee_id','department','joining_date','salary'],rows:[[1,'IT','2026-09-01',50000],[2,'IT','2026-09-05',60000],[3,'HR','2026-09-03',45000],[4,'IT','2026-08-01',55000],[5,'HR','2026-09-10',50000]],setup:"CREATE TABLE employees(employee_id INTEGER,department TEXT,joining_date TEXT,salary INTEGER);INSERT INTO employees VALUES(1,'IT','2026-09-01',50000),(2,'IT','2026-09-05',60000),(3,'HR','2026-09-03',45000),(4,'IT','2026-08-01',55000),(5,'HR','2026-09-10',50000);",sql:"WITH recent AS(SELECT * FROM employees WHERE joining_date>=date('2026-09-22','-30 day')) SELECT employee_id,department,joining_date,salary,SUM(salary) OVER(PARTITION BY department ORDER BY joining_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) cumulative_salary FROM recent ORDER BY department,joining_date;",out:[['3','HR','2026-09-03','45000','45000'],['5','HR','2026-09-10','50000','95000'],['1','IT','2026-09-01','50000','50000'],['2','IT','2026-09-05','60000','110000']],h1:'Filter to the last 30 days before calculating the running total.',h2:'SUM(salary) OVER(PARTITION BY department ORDER BY joining_date ...).',exp:'The CTE keeps only recent employees. SUM OVER then adds each salary to the previous salaries in the same department.',ans:'I first filter employees who joined in the last 30 days. Then I use SUM OVER partitioned by department and ordered by joining date to create the cumulative salary.',follow:'Why should the date filter happen before the window calculation?'},
{id:'Q009',t:'Week-over-week sales',l:'Medium',topic:'LAG / Time Series',q:'Given weekly sales, show the previous week sales and the change from the previous week.',simple:'Use LAG on weekly sales ordered by week, then subtract the previous value from the current value.',schema:'weekly_sales(week_start, sales)',cols:['week_start','sales'],rows:[['2026-08-31',10000],['2026-09-07',12000],['2026-09-14',9000],['2026-09-21',15000]],setup:"CREATE TABLE weekly_sales(week_start TEXT,sales INTEGER);INSERT INTO weekly_sales VALUES('2026-08-31',10000),('2026-09-07',12000),('2026-09-14',9000),('2026-09-21',15000);",sql:"SELECT week_start,sales,LAG(sales) OVER(ORDER BY week_start) previous_week_sales,sales-LAG(sales) OVER(ORDER BY week_start) change_from_previous FROM weekly_sales ORDER BY week_start;",out:[['2026-08-31','10000',null,null],['2026-09-07','12000','10000','2000'],['2026-09-14','9000','12000','-3000'],['2026-09-21','15000','9000','6000']],h1:'You need the previous row after sorting by week.',h2:'Use LAG(sales) OVER(ORDER BY week_start).',exp:'LAG returns the prior week value. Subtracting it from current sales gives the week-over-week change. The first week has no previous value.',ans:'I use LAG ordered by week to bring the previous week sales into the current row, then subtract previous sales from current sales.',follow:'How would you calculate the week-over-week percentage change?'},
{id:'Q010',t:'Customers without orders',l:'Easy',topic:'LEFT JOIN / NULL',q:'Find customers who have never placed an order.',simple:'Keep every customer with a LEFT JOIN and then find rows where no matching order exists.',schema:'customers(customer_id, name)\norders(order_id, customer_id)',cols:['customer_id','name'],rows:[[1,'Amit'],[2,'Ravi'],[3,'Neha'],[4,'Priya']],setup:"CREATE TABLE customers(customer_id INTEGER,name TEXT);CREATE TABLE orders(order_id INTEGER,customer_id INTEGER);INSERT INTO customers VALUES(1,'Amit'),(2,'Ravi'),(3,'Neha'),(4,'Priya');INSERT INTO orders VALUES(1001,1),(1002,1),(1003,3);",sql:"SELECT c.customer_id,c.name FROM customers c LEFT JOIN orders o ON c.customer_id=o.customer_id WHERE o.customer_id IS NULL;",out:[['2','Ravi'],['4','Priya']],h1:'Start with customers because you want to keep customers even when no order exists.',h2:'Use LEFT JOIN and filter the unmatched order side with IS NULL.',exp:'LEFT JOIN keeps all customers. For a customer with no matching order, the order columns become NULL, so IS NULL identifies customers without orders.',ans:'I use a LEFT JOIN from customers to orders because I need to keep customers with no matching order. Then I filter where the order customer_id is NULL.',follow:'What would happen if we used INNER JOIN instead?'}
];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function normRows(rows){return rows.map(r=>r.map(v=>v===null?'NULL':String(v))).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)))}
function table(rows,headers){if(!rows.length)return '<p class="text">No rows returned.</p>';return '<table class="table"><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v===null?'NULL':v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function visibleQs(){return Q.filter(x=>filter==='All'||x.l===filter)}
function renderNav(){document.getElementById('nav').innerHTML=visibleQs().map(x=>'<button class="qbtn '+(Q.indexOf(x)===current?'active ':'')+'" onclick="openQ('+Q.indexOf(x)+')">'+(completed.includes(x.id)?'✓':'○')+' '+esc(x.id)+' · '+esc(x.t)+'</button>').join('')}
function render(){const x=Q[current];document.getElementById('title').textContent=x.id+' · '+x.t;document.getElementById('pill').textContent='🟡 '+x.l+' · '+x.topic;renderNav();document.getElementById('bar').style.width=(completed.length/Q.length*100)+'%';document.getElementById('progress').textContent=completed.length+' / '+Q.length+' completed';document.getElementById('page').innerHTML=`<div class="card"><h3>🧑‍💼 Interviewer Question</h3><div class="question">${esc(x.q)}</div><h3 style="margin-top:18px">What is being asked?</h3><div class="what">${esc(x.simple)}</div></div><div class="card"><h3>📋 Table Structure</h3><div class="schema">${esc(x.schema)}</div><h3 style="margin-top:20px">📊 Sample Data</h3>${table(x.rows,x.cols)}</div><div class="card"><h3>🤔 Think first</h3><p class="text">Explain your approach in 1–2 sentences before writing SQL.</p><div class="hint"><b>Hint 1:</b> ${esc(x.h1)}</div><div class="hint"><b>Hint 2:</b> ${esc(x.h2)}</div></div><div class="card"><h3>✍️ Write your SQL</h3><textarea id="editor" class="editor" spellcheck="false" placeholder="Write your SQL here..."></textarea><div class="actions"><button class="btn run" onclick="runSQL()">▶ Run SQL</button><button class="btn check" onclick="checkAnswer()">✓ Check Answer</button><button class="btn secondary" onclick="showSolution()">Show Correct Query</button><button class="btn secondary" onclick="document.getElementById('editor').value=''">Clear</button></div><div id="result" style="margin-top:10px"></div></div><div class="card"><h3>📖 Learn after solving</h3><div id="solution" class="hidden solution"><pre>${esc(x.sql)}</pre><p class="text"><b>Explain every line:</b> ${esc(x.exp)}</p><div class="interview"><b>🗣️ Interview explanation:</b><br>${esc(x.ans)}</div><p class="text"><b>❓ Follow-up:</b> ${esc(x.follow)}</p></div><p id="solutionNote" class="text">Try the query first. The correct query and explanation will appear when you choose “Show Correct Query”.</p></div>`}
function openQ(i){current=i;render()}
async function initDB(x){if(!SQLLib) SQLLib=await initSqlJs({locateFile:file=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'+file});db=new SQLLib.Database();db.run(x.setup)}
async function execute(sql){if(!sql.trim())throw new Error('Please write a SQL query first.');await initDB(Q[current]);return db.exec(sql)}
async function runSQL(){const box=document.getElementById('result');box.innerHTML='';try{const r=await execute(document.getElementById('editor').value);if(!r.length){box.innerHTML='<div class="success">✅ Query executed successfully, but it returned no rows.</div>';return}box.innerHTML='<div class="success">✅ Query executed successfully.</div><div class="result">'+table(r[0].values,r[0].columns)+'</div>'}catch(e){box.innerHTML='<div class="error">❌ SQL Error<br><br>'+esc(e.message)+'</div>'}}
async function checkAnswer(){const box=document.getElementById('result');box.innerHTML='';try{const r=await execute(document.getElementById('editor').value);const actual=normRows(r.length?r[0].values:[]);const expected=normRows(Q[current].out);if(JSON.stringify(actual)===JSON.stringify(expected)){if(!completed.includes(Q[current].id)){completed.push(Q[current].id);localStorage.setItem('sqlPracticeCompleted',JSON.stringify(completed))}box.innerHTML='<div class="success">✅ Correct! Your result matches the expected output.</div>';renderNav();document.getElementById('bar').style.width=(completed.length/Q.length*100)+'%';document.getElementById('progress').textContent=completed.length+' / '+Q.length+' completed'}else{box.innerHTML='<div class="error">❌ Wrong answer. Your query ran successfully, but the result does not match the expected output.<br><br><b>Try again or use Hint 1 / Hint 2.</b></div>'}}catch(e){box.innerHTML='<div class="error">❌ SQL Error<br><br>'+esc(e.message)+'</div>'}}
function showSolution(){document.getElementById('solution').classList.remove('hidden');document.getElementById('solutionNote').classList.add('hidden')}
document.querySelectorAll('.filter button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;renderNav()}));
render();
</script>
