<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQL Data Analyst Interview Practice</title><style>:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#697386;--line:#e2e7ef;--dark:#101827;--dark2:#1b2638;--blue:#2563eb;--green:#15803d;--yellow:#a16207;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.app{display:grid;grid-template-columns:330px 1fr;min-height:100vh}.side{background:var(--dark);color:#fff;padding:20px 15px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:4px 10px 16px;border-bottom:1px solid #2b374a}.brand h1{font-size:19px;line-height:1.15;margin:0 0 8px}.brand p{font-size:12px;color:#aeb8c8;margin:0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:14px 4px;border-bottom:1px solid #2b374a}.tab{border:1px solid #344157;background:#182235;color:#cbd4e2;border-radius:8px;padding:10px 6px;cursor:pointer;font-weight:700;font-size:11px}.tab.active{background:#2563eb;color:#fff;border-color:#2563eb}.controls{padding:12px 4px;border-bottom:1px solid #2b374a}input,select{width:100%;border:1px solid #344157;border-radius:8px;background:#182235;color:#fff;padding:9px;font-size:12px;margin-bottom:8px}.stats{font-size:11px;color:#aeb8c8}.nav{padding:9px 0}.qbtn{width:100%;border:0;background:transparent;color:#cbd4e2;text-align:left;border-radius:8px;padding:8px 10px;margin:2px 0;cursor:pointer;font-size:12px;line-height:1.35}.qbtn:hover,.qbtn.active{background:var(--dark2);color:#fff}.main{padding:30px;max-width:1400px;width:100%;margin:auto}.header{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}.header h2{margin:0 0 7px;font-size:27px}.header p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin:14px 0;box-shadow:0 8px 24px #1018270f}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:11px;background:#fff;margin-right:6px}.question{font-size:20px;font-weight:700;line-height:1.45;margin:12px 0}.meta{color:var(--muted);font-size:13px}.answer{background:#f0fdf4;border:1px solid #bbf7d0;border-left:5px solid var(--green);border-radius:9px;padding:15px;line-height:1.7;font-size:14px}.tip{background:#fff9df;border:1px solid #fde68a;border-left:5px solid #eab308;border-radius:9px;padding:13px;line-height:1.6;font-size:13px}.hint{background:#fff9df;border-left:5px solid #eab308;border-radius:8px;padding:12px;margin:8px 0;line-height:1.5;font-size:13px}.code{background:#0b1220;color:#e5edf8;border-radius:9px;padding:16px;overflow:auto;font:13px/1.55 Consolas,monospace;white-space:pre}.editor{width:100%;min-height:190px;background:#0b1220;color:#e5edf8;border:1px solid #27344a;border-radius:9px;padding:15px;font:13px/1.55 Consolas,monospace;resize:vertical}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.run{background:#0f8b78;color:#fff}.check{background:#2563eb;color:#fff}.show{background:#e9eef6;color:#172033}.clear{background:#e9eef6;color:#172033}.result{margin-top:12px;border-radius:9px;padding:12px;font-size:13px;line-height:1.5}.ok{background:#ecfdf5;border:1px solid #86efac;color:#166534}.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}.tablewrap{overflow:auto;margin-top:12px}.resulttable{border-collapse:collapse;width:100%;font-size:13px}.resulttable th,.resulttable td{border:1px solid #dbe2ec;padding:8px;text-align:left}.resulttable th{background:#f1f5f9}.hidden{display:none}.small{font-size:12px;color:var(--muted)}.sectionTitle{font-size:18px;margin:0 0 10px}.homebox{background:#eef5ff;border:1px solid #bfdbfe;border-radius:10px;padding:16px;line-height:1.65}.back{display:inline-block;background:#e9eef6;color:#172033;text-decoration:none;border-radius:8px;padding:9px 12px;font-weight:700;font-size:12px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.main{padding:18px}.header{flex-direction:column}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><h1>SQL DATA ANALYST<br>INTERVIEW PRACTICE</h1><p>Theory + Runnable SQL Practice</p></div><div class="tabs"><button id="theoryTab" class="tab active">📘 Theory 155</button><button id="practiceTab" class="tab">💻 Practice 10</button></div><div class="controls"><input id="search" placeholder="Search questions..."><select id="category"><option value="All">All topics</option></select><select id="difficulty"><option value="All">All difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select><div class="stats" id="stats"></div></div><div class="nav" id="nav"></div></aside><main class="main"><div class="header"><div><h2 id="title">SQL Theory Interview Questions</h2><p id="subtitle">155 theory questions with simple, interview-friendly explanations. No SQL editor here.</p></div><a class="back" href="all_questions.html">📚 Full Question Bank</a></div><div id="page"></div></main></div><script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script><script>
const theory=[
['Select all employees from an employee table.','Use SELECT * FROM employees to return every column and every row. In real projects, select only the columns you need.'],['Select employee name and salary only.','Use SELECT employee_name, salary FROM employees. Selecting required columns makes the result easier to read.'],['Find employees with salary greater than 50000.','Use WHERE salary > 50000. WHERE filters individual rows before the result is returned.'],['Find employees in the Analytics department.','Use WHERE department = \'Analytics\'. Text values normally need quotes.'],['Find employees whose name starts with A.','Use WHERE employee_name LIKE \'A%\'. The % wildcard means any number of characters.'],['Find employees whose name contains an.','Use WHERE employee_name LIKE \'%an%\'. The pattern can appear anywhere in the name.'],['Find employees with salary between 50000 and 100000.','Use BETWEEN 50000 AND 100000. BETWEEN includes both boundary values in common SQL implementations.'],['Find employees whose department is NULL.','Use WHERE department IS NULL. Do not use = NULL because NULL means missing or unknown.'],['Replace NULL department with Unknown.','Use COALESCE(department, \'Unknown\') to display a replacement value when department is NULL.'],['Sort employees by salary from highest to lowest.','Use ORDER BY salary DESC. DESC means descending, so the largest salary appears first.'],['Return the five highest-paid employees.','Use ORDER BY salary DESC with LIMIT 5, or the equivalent TOP/FETCH syntax for your database.'],['Count total employees.','COUNT(*) counts rows. It is the normal choice when you want the total number of records.'],['Find the average salary.','Use AVG(salary). AVG ignores NULL salary values in standard SQL.'],['Find minimum and maximum salary.','Use MIN(salary) and MAX(salary) together to find the salary range.'],['Count employees department-wise.','GROUP BY department and use COUNT(*). GROUP BY creates one result group per department.'],['Find departments having more than 10 employees.','GROUP BY department, then use HAVING COUNT(*) > 10. HAVING filters groups after aggregation.'],['Find the total salary by department.','GROUP BY department and calculate SUM(salary) for each department.'],['Find the average salary by department.','GROUP BY department and calculate AVG(salary).'],['Find the difference between maximum and minimum salary by department.','GROUP BY department and calculate MAX(salary) - MIN(salary).'],['Use CASE to create salary bands: Low, Medium, High.','CASE lets you create conditional labels, for example Low below 50000, Medium from 50000 to 100000, and High above 100000.'],
['Explain and write an INNER JOIN between orders and customers.','INNER JOIN returns only rows where the join key matches in both tables. Join orders.customer_id to customers.customer_id.'],['Find customers who have orders using INNER JOIN.','Join customers to orders on customer_id. Because it is an INNER JOIN, customers without orders disappear from the result.'],['Find customers who have never placed an order using LEFT JOIN.','Start with customers, LEFT JOIN orders, then filter WHERE orders.customer_id IS NULL.'],['Find products that have never been ordered.','Start with products, LEFT JOIN order items, and keep rows where the order-item key is NULL.'],['Find employees and their department names.','Join employees to departments using department_id. Select employee details and department name.'],['Find employees whose manager record is missing.','Use a LEFT JOIN from employees to employees again as managers, then filter manager.employee_id IS NULL.'],['Find employees earning more than their manager using SELF JOIN.','Join employees to the same employee table using manager_id, then compare employee.salary > manager.salary.'],['Find customers who ordered products from the Electronics category.','Join orders to products, filter category = Electronics, and use DISTINCT customer_id if a customer can have multiple matching orders.'],['Find orders with missing product details.','LEFT JOIN orders to products and keep rows where the product-side key is NULL.'],['Explain INNER JOIN vs LEFT JOIN with row-count examples.','INNER JOIN keeps matches only. LEFT JOIN keeps every row from the left table and adds NULLs when there is no match.'],['Explain FULL OUTER JOIN with a business example.','FULL OUTER JOIN keeps matches plus unmatched rows from both sides. It is useful for reconciliation between two datasets.'],['Find records present in table A but not table B.','Use LEFT JOIN and filter the right-side key IS NULL, or use NOT EXISTS.'],['Find common customers between two datasets.','Use INNER JOIN on customer_id, or INTERSECT where supported.'],['Join three tables: orders, customers and products.','Join orders to customers by customer_id and orders to products by product_id. Check the grain after each join.'],['Identify duplicate rows caused by an incorrect join.','Compare row counts before and after the join and inspect the join keys. A one-to-many or many-to-many join can multiply rows.'],['Given A = {1,2,3} and B = {2,3,4}, determine INNER, LEFT and FULL OUTER JOIN row sets.','INNER contains 2,3. LEFT contains 1,2,3. FULL OUTER contains 1,2,3,4 when joining on the value.'],['Explain why SQLite needs a workaround for FULL OUTER JOIN in the interactive browser runner.','The browser runner uses SQLite, which does not provide native FULL OUTER JOIN syntax in the same way as databases such as PostgreSQL. A UNION of LEFT JOIN patterns can reproduce it.'],
['Find total sales by month.','Group sales by the required month and calculate SUM(sales). Make sure the date expression matches the business timezone and grain.'],['Find total sales by customer.','GROUP BY customer_id and calculate SUM(order_amount).'],['Find average order value by customer.','GROUP BY customer_id and calculate AVG(order_amount).'],['Find customers with more than five orders.','GROUP BY customer_id and use HAVING COUNT(*) > 5.'],['Find customers whose total spend exceeds 100000.','GROUP BY customer_id and use HAVING SUM(order_amount) > 100000.'],['Find the category with the highest sales.','Aggregate sales by category, sort descending by total sales, and return the first category.'],['Find the month with the highest revenue.','Aggregate revenue by month, order descending, and take the highest month.'],['Find departments with average salary above company average.','Calculate department AVG(salary), then compare each department result with the overall AVG(salary), often using a subquery or CTE.'],['Find products sold more than 100 times.','GROUP BY product_id and use HAVING COUNT(*) > 100.'],['Find customers with exactly one order.','GROUP BY customer_id and use HAVING COUNT(*) = 1.'],['Find categories having at least three products.','GROUP BY category and use HAVING COUNT(DISTINCT product_id) >= 3.'],['Find duplicate customer emails.','GROUP BY email and use HAVING COUNT(*) > 1.'],['Find duplicate customer records based on name and date of birth.','GROUP BY the business-key columns name and date_of_birth and keep groups with COUNT(*) > 1.'],['Explain WHERE vs HAVING.','WHERE filters rows before GROUP BY. HAVING filters groups after aggregation, so it is used for conditions such as COUNT(*) > 5.'],['Explain COUNT(*) vs COUNT(column) vs COUNT(DISTINCT column).','COUNT(*) counts rows, COUNT(column) counts non-NULL values, and COUNT(DISTINCT column) counts unique non-NULL values.'],['Find departments whose average salary is greater than company average salary.','Calculate department averages and compare them to one overall company average using a CTE or subquery.'],
['Find the highest-paid employee in each department.','Use ROW_NUMBER or RANK partitioned by department and ordered by salary DESC, then keep rank 1.'],['Find the second-highest salary in each department.','Use DENSE_RANK partitioned by department and ordered by salary DESC, then keep rank 2.'],['Find the third-highest distinct salary.','Use DENSE_RANK or a distinct salary subquery and select rank 3.'],['Compare RANK, DENSE_RANK and ROW_NUMBER.','ROW_NUMBER gives unique sequence numbers. RANK gives ties the same rank and leaves gaps. DENSE_RANK gives ties the same rank without gaps.'],['Assign row numbers to employees within each department.','Use ROW_NUMBER() OVER(PARTITION BY department_id ORDER BY salary DESC).'],['Find top three customers by revenue in each category.','Aggregate revenue by category and customer, then use ROW_NUMBER or RANK partitioned by category.'],['Calculate running sales total by month.','Use SUM(month_sales) OVER(ORDER BY month) to create a cumulative total.'],['Calculate cumulative salary by department.','Use SUM(salary) OVER(PARTITION BY department ORDER BY employee or joining date).'],['Calculate each employee percentage of department salary.','Divide employee salary by SUM(salary) OVER(PARTITION BY department), then multiply by 100.'],['Calculate each product percentage of category sales.','Aggregate product sales, then divide by the category total using a partitioned window SUM.'],['Find the previous month’s sales using LAG.','LAG(sales) OVER(ORDER BY month) returns the previous row’s sales value.'],['Find the next month’s sales using LEAD.','LEAD(sales) OVER(ORDER BY month) returns the next row’s sales value.'],['Calculate month-over-month sales change.','Subtract previous sales from current sales. Use LAG to get the previous month.'],['Calculate month-over-month sales percentage change.','Use (current - previous) / previous * 100, and handle previous = 0 or NULL safely.'],['Find employees whose salary increased compared with the previous salary record.','Use LAG(salary) partitioned by employee and ordered by effective date, then keep rows where current salary > previous salary.'],['Find employees whose salary never decreased using salary history and LAG.','Compare each salary with LAG(salary). Keep employees for whom no comparison shows a decrease.'],['Find the first order for every customer.','Use ROW_NUMBER partitioned by customer and ordered by order_date ASC, then keep row 1.'],['Find the latest order for every customer.','Use ROW_NUMBER partitioned by customer and ordered by order_date DESC, then keep row 1.'],['Find the second order for every customer.','Use ROW_NUMBER partitioned by customer and order date, then keep row 2.'],['Find the gap in days between consecutive orders.','Use LAG(order_date) and calculate the date difference between current and previous order.'],['Find top two customers in each product category.','Aggregate customer-category revenue, rank customers inside each category, then keep ranks 1 and 2.'],['Calculate cumulative salary department-wise for employees who joined in the last 30 days.','First filter employees by joining date, then apply SUM(salary) OVER(PARTITION BY department ORDER BY joining_date).'],['Compare weekly sales with the previous week using LAG.','Aggregate sales by week first, then use LAG to compare each week with the previous week.'],['Show previous and next weekly sales using LAG and LEAD.','Use both functions over weekly sales ordered by week.'],
['Find orders placed in the last 30 days.','Filter order_date using the database’s current-date function and a 30-day interval or equivalent.'],['Find employees who joined in the last 30 days.','Filter joining_date to the last 30 days using date arithmetic.'],['Calculate employee tenure in years.','Calculate the date difference between today and joining_date, then convert the result to years according to the database.'],['Extract year, month and day from a date.','Use the database-specific date extraction functions such as EXTRACT or strftime in SQLite.'],['Calculate monthly revenue.','Convert order dates to month grain and SUM revenue for each month.'],['Calculate weekly revenue.','Convert order dates to week grain and SUM revenue for each week.'],['Find users active on consecutive days.','Deduplicate each user’s active dates, order them, and compare adjacent dates or use gaps-and-islands logic.'],['Find users active for five consecutive days.','Create a sequence for each user and identify a five-day island using row numbers and date arithmetic.'],['Find the longest login streak for every user.','Create consecutive-date groups, count each group, then keep the longest streak per user.'],['Find customers who ordered in two consecutive months.','Reduce orders to distinct customer-months and compare each month with the previous month using LAG or date arithmetic.'],['Find customers who ordered in January but not February.','Find January customers and exclude customers who appear in February using NOT EXISTS or an anti-join.'],['Find the first and last order date for every customer.','GROUP BY customer_id and use MIN(order_date) and MAX(order_date).'],['Calculate average days between orders.','Use LAG to get the previous order date, calculate gaps, then AVG the non-first gaps.'],['Find orders placed on weekends.','Use the database date function to identify Saturday/Sunday. The exact expression depends on the SQL dialect.'],['Compare current month sales with the same month last year.','Align current and prior-year month values by date and calculate the difference or percentage change.'],
['Find employees earning above company average using a subquery.','Use WHERE salary > (SELECT AVG(salary) FROM employees).'],['Find employees earning above department average.','Calculate the department average for the employee’s department and compare the employee salary to it, often with a correlated subquery or window function.'],['Find customers whose spend is above average customer spend.','First calculate spend per customer, then compare each customer total with the average of those customer totals.'],['Use a CTE to calculate monthly sales and then rank months.','Create monthly sales in a CTE, then apply RANK or ROW_NUMBER in an outer query.'],['Use a CTE to identify duplicate records.','Group by the duplicate-defining columns in a CTE, then join back or filter the grouped results.'],['Use EXISTS to find customers with at least one order.','EXISTS returns true when the subquery finds at least one matching order for the customer.'],['Use NOT EXISTS to find customers without orders.','NOT EXISTS returns true when no matching order exists for that customer.'],['Explain CTE vs subquery.','Both can create an intermediate result. A CTE is named and easier to organize for multi-step logic; a subquery is nested directly inside another query. Performance depends on the database and query.'],['Write a correlated subquery to find employees above department average.','For each employee, calculate the average salary for that employee’s department and compare the employee salary to that correlated result.'],['Use multiple CTEs to calculate a business KPI.','Use one CTE per logical step, such as orders, customers, and final KPI. This keeps complex analysis readable and testable.'],['Find the third-highest salary without window functions.','Use a subquery such as SELECT MAX(salary) below the second-highest value, or use DISTINCT salaries with ORDER BY and OFFSET where supported.'],
['Find customers who purchased every product in a category.','Join orders to products, keep the category, count distinct products per customer, and compare that count with the total number of products in the category.'],['Find the top two customers in every product category.','Aggregate customer sales by category, rank within category, and filter to ranks 1 and 2.'],['Find products whose sales are above category average.','Calculate product sales, calculate category average sales, and compare each product to its category average.'],['Find the most frequently purchased product.','GROUP BY product_id, count purchases, order descending, and return the highest count.'],['Find customers whose every order value is above 1000.','Group orders by customer and use MIN(order_value) > 1000. This ensures no order is at or below 1000.'],['Find customers whose latest order was above their average order value.','Find each customer’s latest order, calculate their average order value, then compare the two results.'],['Find the percentage of customers who placed another order within 30 days.','For each customer, find a later order within 30 days, count qualifying customers, and divide by total customers.'],['Find monthly customer retention.','Define the cohort and return month, identify customers who return, then divide retained customers by the cohort size.'],['Find first-time customers by month.','Find each customer’s first order date and group those first orders by month.'],['Find repeat customers by month.','Identify customers whose order count before or within the month indicates they are returning, then aggregate by month.'],['Find revenue contribution from new vs returning customers.','Classify each order’s customer as new or returning based on first order date, then SUM revenue by month and customer type.'],['Find the longest gap between orders for every customer.','Use LAG to calculate each customer’s gaps, then take MAX(gap) per customer.'],['Find the month with the largest month-over-month revenue increase.','Calculate monthly revenue, use LAG, calculate the increase, then return the largest positive increase.'],['Find the top-selling product in each month.','Aggregate product sales by month, rank products within month, then keep rank 1.'],['Find products whose rank improved month over month.','Rank products by month, use LAG on the rank, and keep products where current rank is numerically lower.'],
['Find NULL values in important columns.','Use IS NULL checks for each important column and report the count or affected rows.'],['Find duplicate customer IDs.','GROUP BY customer_id and use HAVING COUNT(*) > 1.'],['Find duplicate business keys.','Group by the columns that should uniquely identify a business record and find counts greater than one.'],['Find negative sales values.','Use WHERE sales < 0. Then confirm whether negative values are valid refunds or actual data errors.'],['Find orders with invalid dates.','Check for NULL, impossible, malformed, or out-of-range dates using the functions supported by your database.'],['Find orders referencing a product that does not exist.','LEFT JOIN orders to products and keep rows where the product key is NULL.'],['Find customers with invalid email formats.','Use database-specific string matching or regular expressions where supported. Treat the rule as a data-quality check, not proof that an email is deliverable.'],['Find records with leading or trailing spaces.','Compare the original value with TRIM(value). If they differ, whitespace exists.'],['Standardize inconsistent category values.','Use TRIM, UPPER/LOWER, CASE, and a mapping table when possible to convert variants to one standard value.'],['Detect unexpected salary outliers using SQL.','Choose a documented rule such as IQR or z-score, calculate the thresholds, then flag values outside the expected range.'],['Find duplicate customer records using GROUP BY and HAVING.','Group by the fields that define a duplicate and keep groups where COUNT(*) > 1.'],['Validate that a KPI does not double-count records after a JOIN.','Check the row count and business-key uniqueness before and after the join. Aggregate at the intended grain and compare totals.'],
['How would you investigate a slow SQL query?','Check the execution plan, data volume, joins, filters, indexes, scans, sorting, aggregation, and recent data changes. Optimize the measured bottleneck.'],['What is an index and when can it help?','An index is a data structure that can help the database find rows faster. It is useful for selective filters, joins, and ordering, but it also has storage and write costs.'],['Why can SELECT * be inefficient?','It reads and returns columns you may not need, increasing I/O, memory, network traffic, and sometimes preventing covering-index benefits.'],['How can filtering early improve performance?','Reducing rows before expensive joins or aggregations can reduce the amount of data the database must process.'],['When can a JOIN create unexpectedly many rows?','When the join is one-to-many or many-to-many, or the join key is not unique. Validate key uniqueness and the intended grain.'],['How would you read an execution plan?','Look for full scans, expensive joins, large sorts, high estimated or actual row counts, and mismatches between estimates and reality.'],['When can a CTE affect performance depending on the database?','Some databases inline CTEs while others may materialize them. The optimizer behavior matters, so check the execution plan.'],['How would you optimize a query on 500 million rows?','Filter early, select needed columns, use appropriate partitioning and indexes, avoid unnecessary joins, aggregate at the right grain, and inspect the execution plan.'],['What is partitioning and when can it help analytics?','Partitioning splits large tables into manageable pieces, often by date. Queries that filter on the partition key can scan less data.'],['Why can functions on indexed columns affect index usage?','Applying a function directly to an indexed column can make it harder for the optimizer to use a normal index, depending on the database.'],['What is denormalization?','Denormalization intentionally stores some repeated or derived data to reduce joins and speed selected reads.'],['When can denormalization help an analytics workload?','It can simplify reporting queries and reduce expensive joins when read performance is more important than storage duplication.'],['What are the trade-offs of denormalization?','It can improve reads but increases storage, update complexity, and risk of inconsistent duplicated data.'],
['Sales dropped 15% last quarter. How would you investigate?','Break sales down by time, product, geography, channel, customer, price, and volume. Compare each segment with the prior period to locate the driver.'],['Two dashboards show different revenue. How would you reconcile them?','Compare source tables, filters, date ranges, joins, currency, refund treatment, KPI definitions, and aggregation grain step by step.'],['A client says customer churn increased. What data would you request?','Request customer IDs, activity/order history, churn definition, cohort dates, product/channel information, and the comparison period.'],['Marketing spend increased but sales did not. What would you investigate?','Check channel-level spend, reach, conversions, pricing, timing, attribution, campaign changes, and whether the sales metric changed.'],['Conversion rate dropped suddenly. How would you perform root-cause analysis?','Check tracking first, then segment conversion by device, channel, geography, funnel step, product, and time to find where the change occurred.'],['Revenue is growing but profit is falling. What dimensions would you analyze?','Analyze price, volume, discounts, product mix, customer mix, channel costs, COGS, refunds, and operating costs.'],['A KPI changed after a pipeline migration. How would you validate it?','Run old and new logic on the same historical data, compare row counts and aggregates, inspect transformations, and identify the first point where values diverge.'],['A stakeholder asks for a dashboard by tomorrow. How would you prioritize?','Clarify the decision and must-have KPIs, deliver a small validated version first, document assumptions, and defer lower-priority visuals.'],['How would you explain a complex SQL result to a non-technical client?','Start with the business question, explain the key finding in plain language, show the important numbers, and avoid SQL terminology unless needed.'],['How would you validate an important business KPI before presenting it?','Check source freshness, row counts, duplicates, filters, joins, date logic, totals against a trusted source, and a few manually verified records.'],['Two teams report different numbers for the same KPI. How would you identify the correct number?','Compare definitions, source systems, filters, time zones, joins, exclusions, and calculation grain. Agree on the business definition before choosing a number.'],['A large dataset contains missing values, outliers and inconsistent date formats. How would you handle it before analysis?','Profile the data, standardize dates and categories, quantify missingness, investigate outliers, apply documented rules, and validate the cleaned dataset before analysis.']
];

const practical=[
{id:'P001',title:'Salary History: salary never decreases',difficulty:'Medium',category:'LAG / Window Functions',ask:'We have a salary history table. Employees receive salary changes over time. Find employees whose salary never decreased.',what:'Compare every salary with the previous salary for that employee. If there is even one decrease, exclude that employee.',schema:'salary_history(employee_id, effective_date, salary)',data:[['101','2022-01-01','50000'],['101','2023-01-01','55000'],['101','2024-01-01','60000'],['102','2022-01-01','50000'],['102','2023-01-01','60000'],['102','2024-01-01','55000'],['103','2022-01-01','45000'],['103','2023-01-01','45000'],['103','2024-01-01','50000']],sql:`WITH x AS (SELECT employee_id, effective_date, salary, LAG(salary) OVER(PARTITION BY employee_id ORDER BY effective_date) AS prev_salary FROM salary_history) SELECT employee_id FROM x GROUP BY employee_id HAVING SUM(CASE WHEN prev_salary IS NOT NULL AND salary < prev_salary THEN 1 ELSE 0 END)=0 ORDER BY employee_id;`,expected:[['101'],['103']],hint:['Use LAG partitioned by employee_id and ordered by effective_date.','After finding decreases, group by employee and keep employees with zero decreases.']},
{id:'P002',title:'Five consecutive login days',difficulty:'Medium',category:'Date / Gaps and Islands',ask:'Find users who logged in for at least five consecutive calendar days.',what:'Deduplicate login dates per user, identify consecutive-date groups, and count groups with at least five days.',schema:'logins(user_id, login_date)',data:[['1','2026-01-01'],['1','2026-01-02'],['1','2026-01-03'],['1','2026-01-04'],['1','2026-01-05'],['2','2026-01-01'],['2','2026-01-03'],['2','2026-01-04'],['2','2026-01-05'],['2','2026-01-07'],['3','2026-02-10'],['3','2026-02-11'],['3','2026-02-12'],['3','2026-02-13'],['3','2026-02-14']],sql:`WITH d AS (SELECT DISTINCT user_id, login_date FROM logins), r AS (SELECT user_id, login_date, ROW_NUMBER() OVER(PARTITION BY user_id ORDER BY login_date) AS rn FROM d), g AS (SELECT user_id, login_date, date(login_date, '-' || rn || ' days') AS grp FROM r) SELECT user_id FROM g GROUP BY user_id, grp HAVING COUNT(*) >= 5 ORDER BY user_id;`,expected:[['1'],['3']],hint:['Remove duplicate dates first.','For consecutive dates, date(login_date) minus row_number creates the same group key.']},
{id:'P003',title:'Customers who purchased every Electronic product',difficulty:'Medium',category:'GROUP BY / COUNT DISTINCT',ask:'Find customers who purchased every product in the Electronic category.',what:'Join orders to products, keep Electronics, count distinct products per customer, and compare with the total number of Electronic products.',schema:'orders(customer_id, product_id) ; products(product_id, category)',data:[['101','E1'],['101','E2'],['101','E3'],['102','E1'],['102','E2'],['103','E1'],['103','E2'],['103','E3'],['103','E3']],products:[['E1','Electronic'],['E2','Electronic'],['E3','Electronic'],['F1','Furniture']],sql:`SELECT o.customer_id FROM orders o JOIN products p ON o.product_id=p.product_id WHERE p.category='Electronic' GROUP BY o.customer_id HAVING COUNT(DISTINCT o.product_id)=(SELECT COUNT(DISTINCT product_id) FROM products WHERE category='Electronic') ORDER BY o.customer_id;`,expected:[['101'],['103']],hint:['Join orders to products and keep only Electronic products.','Use COUNT(DISTINCT) for each customer and compare it with the total Electronic product count.']},
{id:'P004',title:'Employees earning more than their manager',difficulty:'Easy',category:'SELF JOIN',ask:'Find employees whose salary is greater than their manager salary.',what:'Join the employees table to itself. One copy represents the employee and the other represents the manager.',schema:'employees(employee_id, employee_name, manager_id, salary)',data:[['1','Asha','3','70000'],['2','Ravi','3','90000'],['3','Neha',null,'80000'],['4','Amit','3','75000']],sql:`SELECT e.employee_id, e.employee_name FROM employees e JOIN employees m ON e.manager_id=m.employee_id WHERE e.salary > m.salary ORDER BY e.employee_id;`,expected:[['2','Ravi']],hint:['Use the same table twice with aliases e and m.','Join e.manager_id to m.employee_id, then compare salaries.']},
{id:'P005',title:'Third-highest salary',difficulty:'Medium',category:'DENSE_RANK',ask:'Find the third-highest distinct salary from the employee table.',what:'Rank distinct salary values in descending order and return rank 3.',schema:'employees(employee_id, employee_name, salary)',data:[['1','Asha','90000'],['2','Ravi','80000'],['3','Neha','70000'],['4','Amit','70000'],['5','Kiran','60000'],['6','Pooja','50000']],sql:`WITH r AS (SELECT employee_id, employee_name, salary, DENSE_RANK() OVER(ORDER BY salary DESC) AS dr FROM employees) SELECT employee_id, employee_name, salary FROM r WHERE dr=3 ORDER BY employee_id;`,expected:[['3','Neha','70000'],['4','Amit','70000']],hint:['Use DENSE_RANK because the question says distinct salary.','Filter the rank to 3.']},
{id:'P006',title:'Find duplicate customer records',difficulty:'Easy',category:'GROUP BY / HAVING',ask:'Find duplicate customer records based on customer_name and date_of_birth.',what:'Group by the columns that define a duplicate and keep groups occurring more than once.',schema:'customers(customer_id, customer_name, date_of_birth, email)',data:[['1','Asha','1995-01-01','a@x.com'],['2','Asha','1995-01-01','a2@x.com'],['3','Ravi','1994-02-02','r@x.com'],['4','Neha','1996-03-03','n@x.com'],['5','Neha','1996-03-03','n2@x.com']],sql:`SELECT customer_name, date_of_birth, COUNT(*) AS duplicate_count FROM customers GROUP BY customer_name, date_of_birth HAVING COUNT(*) > 1 ORDER BY customer_name;`,expected:[['Asha','1995-01-01','2'],['Neha','1996-03-03','2']],hint:['Choose the business columns that define a duplicate.','Use GROUP BY plus HAVING COUNT(*) > 1.']},
{id:'P007',title:'Top 2 customers in each category',difficulty:'Hard',category:'RANK / Window Functions',ask:'Find the top two customers by revenue in every product category.',what:'First aggregate revenue by category and customer, then rank customers inside each category.',schema:'sales(customer_id, product_id, amount) ; products(product_id, category)',data:[['101','P1','500'],['101','P2','300'],['102','P1','900'],['102','P3','200'],['103','P2','700'],['103','P3','100'],['104','P3','600']],products:[['P1','Electronics'],['P2','Electronics'],['P3','Furniture']],sql:`WITH s AS (SELECT p.category,o.customer_id,SUM(o.amount) AS revenue FROM sales o JOIN products p ON o.product_id=p.product_id GROUP BY p.category,o.customer_id), r AS (SELECT *,DENSE_RANK() OVER(PARTITION BY category ORDER BY revenue DESC) AS rnk FROM s) SELECT category,customer_id,revenue FROM r WHERE rnk<=2 ORDER BY category,rnk,customer_id;`,expected:[['Electronics','101','800'],['Electronics','103','700'],['Electronics','102','900'],['Furniture','102','200'],['Furniture','103','100']],hint:['Aggregate first, then rank.','PARTITION BY category means the ranking restarts for every category.']},
{id:'P008',title:'Cumulative salary by department',difficulty:'Medium',category:'SUM OVER',ask:'Calculate a running cumulative salary for employees within each department ordered by employee_id.',what:'Use SUM as a window function, partitioned by department and ordered by employee_id.',schema:'employees(employee_id, employee_name, department, salary)',data:[['1','Asha','Analytics','50000'],['2','Ravi','Analytics','60000'],['3','Neha','Analytics','70000'],['4','Amit','Sales','45000'],['5','Kiran','Sales','55000']],sql:`SELECT employee_id,employee_name,department,salary,SUM(salary) OVER(PARTITION BY department ORDER BY employee_id ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cumulative_salary FROM employees ORDER BY department,employee_id;`,expected:[['1','Asha','Analytics','50000','50000'],['2','Ravi','Analytics','60000','110000'],['3','Neha','Analytics','70000','180000'],['4','Amit','Sales','45000','45000'],['5','Kiran','Sales','55000','100000']],hint:['PARTITION BY department creates one running total per department.','ORDER BY employee_id defines the running sequence.']},
{id:'P009',title:'Week-over-week sales',difficulty:'Medium',category:'LAG / Window Functions',ask:'Compare weekly sales with the previous week and calculate the change.',what:'Create weekly totals first, then use LAG to bring the previous week into the current row.',schema:'weekly_sales(week_start, sales)',data:[['2026-01-05','10000'],['2026-01-12','12000'],['2026-01-19','11000'],['2026-01-26','15000']],sql:`SELECT week_start,sales,LAG(sales) OVER(ORDER BY week_start) AS previous_week,sales-LAG(sales) OVER(ORDER BY week_start) AS change FROM weekly_sales ORDER BY week_start;`,expected:[['2026-01-05','10000',null,null],['2026-01-12','12000','10000','2000'],['2026-01-19','11000','12000','-1000'],['2026-01-26','15000','11000','4000']],hint:['LAG gets the previous row.','Subtract previous sales from current sales.']},
{id:'P010',title:'Customers without orders',difficulty:'Easy',category:'LEFT JOIN / NULL',ask:'Find customers who have never placed an order.',what:'Start from customers, LEFT JOIN orders, and keep customers for whom the order side is NULL.',schema:'customers(customer_id, customer_name) ; orders(order_id, customer_id)',data:[['101','Asha'],['102','Ravi'],['103','Neha'],['104','Amit']],orders:[['1','101'],['2','103'],['3','103']],sql:`SELECT c.customer_id,c.customer_name FROM customers c LEFT JOIN orders o ON c.customer_id=o.customer_id WHERE o.order_id IS NULL ORDER BY c.customer_id;`,expected:[['102','Ravi'],['104','Amit']],hint:['LEFT JOIN keeps all customers.','Rows with no matching order have NULL in the order columns.']}
];
let mode='theory',filtered=[...theoryBank],current=1,db=null,SQL=null;
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function setup(){document.getElementById('theoryTab').onclick=()=>switchMode('theory');document.getElementById('practiceTab').onclick=()=>switchMode('practice');document.getElementById('search').oninput=apply;document.getElementById('category').onchange=apply;document.getElementById('difficulty').onchange=apply;render()}
function switchMode(m){mode=m;document.getElementById('theoryTab').classList.toggle('active',m==='theory');document.getElementById('practiceTab').classList.toggle('active',m==='practice');document.getElementById('search').value='';document.getElementById('category').innerHTML='<option value="All">All topics</option>';document.getElementById('difficulty').value='All';filtered=m==='theory'?[...theoryBank]:[...practical];const cats=[...new Set(filtered.map(q=>q.category))];cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;document.getElementById('category').appendChild(o)});document.getElementById('subtitle').textContent=m==='theory'?'155 theory questions with simple, interview-friendly explanations.':'10 runnable SQL interview questions with sample data, hints, Run SQL, Check Answer and Show Correct Query.';render()}
function apply(){const s=document.getElementById('search').value.toLowerCase().trim(),c=document.getElementById('category').value,d=document.getElementById('difficulty').value;filtered=(mode==='theory'?theoryBank:practical).filter(q=>(!s||(q.q||q.title).toLowerCase().includes(s)||q.id.toLowerCase().includes(s))&&(c==='All'||q.category===c)&&(d==='All'||q.difficulty===d));render()}
function render(){document.getElementById('stats').textContent=`Showing ${filtered.length} of ${mode==='theory'?155:10}`;const nav=document.getElementById('nav');nav.innerHTML='';filtered.forEach(q=>{const b=document.createElement('button');b.className='qbtn';b.textContent=`${q.id} · ${q.q||q.title}`;b.onclick=()=>mode==='theory'?showTheory(q.n):showPractice(q.id);nav.appendChild(b)});if(filtered.length){if(mode==='theory'){current=filtered[0].n;showTheory(current)}else showPractice(filtered[0].id)}else document.getElementById('page').innerHTML='<div class="card">No questions match your filters.</div>'}
function activate(id){document.querySelectorAll('.qbtn').forEach(b=>b.classList.toggle('active',b.textContent.startsWith(id+' · ')))}
function showTheory(n){const q=theoryBank.find(x=>x.n===n);if(!q)return;current=n;activate(q.id);document.getElementById('title').textContent=`${q.id} · ${q.q}`;document.getElementById('page').innerHTML=`<div class="card"><span class="badge">${q.category}</span><span class="badge">${q.difficulty}</span><div class="question">🧑‍💼 ${esc(q.q)}</div><div class="meta">Theory Question ${q.n} of 155</div></div><div class="card"><h3>💡 Simple Answer</h3><div class="answer">${esc(q.a)}</div></div><div class="card"><h3>🎯 Interview Tip</h3><div class="tip">Answer in simple steps: explain the SQL concept first, then give a short example, and mention one practical use case when appropriate.</div></div>`}
function tables(p){let html=`<div class="small"><b>${esc(p.schema)}</b></div><div class="tablewrap">`;if(p.data){html+=`<table class="resulttable"><tr><th>${esc(p.schema.split('(')[0])}</th><th>Sample rows</th></tr>${p.data.map(r=>`<tr><td>row</td><td>${esc(r.join(' | '))}</td></tr>`).join('')}</table>`}if(p.products)html+=`<p class="small"><b>products:</b> ${esc(p.products.map(r=>r.join(' | ')).join(' ; '))}</p>`;if(p.orders)html+=`<p class="small"><b>orders:</b> ${esc(p.orders.map(r=>r.join(' | ')).join(' ; '))}</p>`;return html+'</div>'}
function renderRows(rows){if(!rows||!rows.length)return '<p class="small">No rows returned.</p>';return `<div class="tablewrap"><table class="resulttable"><tbody>${rows.map((r,i)=>`<tr>${r.map((c,j)=>`<td>${i===0?'':''}${esc(c===null?'NULL':c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function showPractice(id){const p=practical.find(x=>x.id===id);if(!p)return;activate(p.id);document.getElementById('title').textContent=`${p.id} · ${p.title}`;document.getElementById('page').innerHTML=`<div class="card"><span class="badge">${p.category}</span><span class="badge">${p.difficulty}</span><div class="question">🧑‍💼 ${esc(p.ask)}</div><h3>What is being asked?</h3><div class="homebox">${esc(p.what)}</div></div><div class="card"><h3>📋 Table Structure & Sample Data</h3>${tables(p)}</div><div class="card"><h3>🤔 Think first</h3><p class="small">Explain your approach in 1–2 sentences before writing SQL.</p><div class="hint"><b>Hint 1:</b> ${esc(p.hint[0])}</div><div class="hint"><b>Hint 2:</b> ${esc(p.hint[1])}</div></div><div class="card"><h3>✍️ Write your SQL</h3><textarea id="editor" class="editor" spellcheck="false"></textarea><div class="buttons"><button class="btn run" onclick="runSQL('${p.id}')">▶ Run SQL</button><button class="btn check" onclick="checkSQL('${p.id}')">✓ Check Answer</button><button class="btn show" onclick="document.getElementById('editor').value=practical.find(x=>x.id==='${p.id}').sql">Show Correct Query</button><button class="btn clear" onclick="document.getElementById('editor').value='';document.getElementById('result').innerHTML=''">Clear</button></div><div id="result"></div></div><div class="card"><h3>📚 Simple explanation</h3><div class="answer">Try the query yourself first. Then use <b>Show Correct Query</b> and explain the logic aloud as if you were in an interview.</div></div>`;initDB(p)}
async function initDB(p){if(!SQL){try{SQL=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/'+f})}catch(e){document.getElementById('result').innerHTML='<div class="result err">Could not load the SQL browser engine. Refresh the page and try again.</div>';return}}try{db=new SQL.Database();createData(p)}catch(e){document.getElementById('result').innerHTML='<div class="result err">Database setup error: '+esc(e.message)+'</div>'}}
function createData(p){if(p.id==='P001'){db.run(`CREATE TABLE salary_history(employee_id INTEGER,effective_date TEXT,salary INTEGER)`);db.run(`INSERT INTO salary_history VALUES ${p.data.map(r=>`(${r[0]},'${r[1]}',${r[2]})`).join(',')}`)}if(p.id==='P002'){db.run('CREATE TABLE logins(user_id INTEGER,login_date TEXT)');db.run(`INSERT INTO logins VALUES ${p.data.map(r=>`(${r[0]},'${r[1]}')`).join(',')}`)}if(p.id==='P003'){db.run('CREATE TABLE orders(customer_id INTEGER,product_id TEXT)');db.run(`INSERT INTO orders VALUES ${p.data.map(r=>`(${r[0]},'${r[1]}')`).join(',')}`);db.run('CREATE TABLE products(product_id TEXT,category TEXT)');db.run(`INSERT INTO products VALUES ${p.products.map(r=>`('${r[0]}','${r[1]}')`).join(',')}`)}if(p.id==='P004'){db.run('CREATE TABLE employees(employee_id INTEGER,employee_name TEXT,manager_id INTEGER,salary INTEGER)');db.run(`INSERT INTO employees VALUES ${p.data.map(r=>`(${r[0]},'${r[1]}',${r[2]===null?'NULL':r[2]},${r[3]})`).join(',')}`)}if(p.id==='P005'){db.run('CREATE TABLE employees(employee_id INTEGER,employee_name TEXT,salary INTEGER)');db.run(`INSERT INTO employees VALUES ${p.data.map(r=>`(${r[0]},'${r[1]}',${r[2]})`).join(',')}`)}if(p.id==='P006'){db.run('CREATE TABLE customers(customer_id INTEGER,customer_name TEXT,date_of_birth TEXT,email TEXT)');db.run(`INSERT INTO customers VALUES ${p.data.map(r=>`(${r[0]},'${r[1]}','${r[2]}','${r[3]}')`).join(',')}`)}if(p.id==='P007'){db.run('CREATE TABLE sales(customer_id INTEGER,product_id TEXT,amount INTEGER)');db.run(`INSERT INTO sales VALUES ${p.data.map(r=>`(${r[0]},'${r[1]}',${r[2]})`).join(',')}`);db.run('CREATE TABLE products(product_id TEXT,category TEXT)');db.run(`INSERT INTO products VALUES ${p.products.map(r=>`('${r[0]}','${r[1]}')`).join(',')}`)}if(p.id==='P008'){db.run('CREATE TABLE employees(employee_id INTEGER,employee_name TEXT,department TEXT,salary INTEGER)');db.run(`INSERT INTO employees VALUES ${p.data.map(r=>`(${r[0]},'${r[1]}','${r[2]}',${r[3]})`).join(',')}`)}if(p.id==='P009'){db.run('CREATE TABLE weekly_sales(week_start TEXT,sales INTEGER)');db.run(`INSERT INTO weekly_sales VALUES ${p.data.map(r=>`('${r[0]}',${r[1]})`).join(',')}`)}if(p.id==='P010'){db.run('CREATE TABLE customers(customer_id INTEGER,customer_name TEXT)');db.run(`INSERT INTO customers VALUES ${p.data.map(r=>`(${r[0]},'${r[1]}')`).join(',')}`);db.run('CREATE TABLE orders(order_id INTEGER,customer_id INTEGER)');db.run(`INSERT INTO orders VALUES ${p.orders.map(r=>`(${r[0]},${r[1]})`).join(',')}`)}}
function execute(sql){if(!db)throw Error('SQL engine is still loading. Please wait a moment and run again.');const res=db.exec(sql);if(!res.length)return {columns:[],values:[]};return {columns:res[0].columns,values:res[0].values}}
function showResult(r,good){let h=good?'<div class="result ok">✅ Query executed successfully.</div>':'<div class="result ok">✅ Query executed successfully.</div>';if(r.values.length){h+=`<div class="tablewrap"><table class="resulttable"><thead><tr>${r.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${r.values.map(row=>`<tr>${row.map(c=>`<td>${esc(c===null?'NULL':c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}document.getElementById('result').innerHTML=h}
function runSQL(id){const sql=document.getElementById('editor').value.trim();if(!sql){document.getElementById('result').innerHTML='<div class="result err">Please write SQL first.</div>';return}try{const r=execute(sql);showResult(r,false)}catch(e){document.getElementById('result').innerHTML='<div class="result err">❌ SQL Error<br>'+esc(e.message)+'</div>'}}
function norm(v){return v===null||v===undefined?'NULL':String(v).trim().toLowerCase()}
function checkSQL(id){const p=practical.find(x=>x.id===id);const sql=document.getElementById('editor').value.trim();if(!sql){document.getElementById('result').innerHTML='<div class="result err">Write your SQL first, then click Check Answer.</div>';return}try{const r=execute(sql);const actual=r.values.map(row=>row.map(norm));const expected=p.expected.map(row=>row.map(norm));const a=JSON.stringify(actual),e=JSON.stringify(expected);if(a===e){showResult(r,true);document.getElementById('result').innerHTML+='<div class="result ok">🎉 Correct answer. Your output matches the expected result.</div>'}else{showResult(r,false);document.getElementById('result').innerHTML+='<div class="result err">❌ Not matching the expected output yet. Check your joins, filters, grouping, ordering, or window-function logic.</div>'}}catch(e){document.getElementById('result').innerHTML='<div class="result err">❌ SQL Error<br>'+esc(e.message)+'</div>'}}
setup();
</script></body></html>
