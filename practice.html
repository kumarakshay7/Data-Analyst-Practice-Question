<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>155-Question SQL Interview Bank | Simple Answers</title><style>:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#697386;--line:#e2e7ef;--dark:#101827;--dark2:#1b2638;--blue:#2563eb;--green:#15803d;--yellow:#a16207}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.app{display:grid;grid-template-columns:330px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:20px 15px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:4px 10px 17px;border-bottom:1px solid #2b374a}.brand h1{font-size:19px;line-height:1.15;margin:0 0 8px}.brand p{font-size:12px;color:#aeb8c8;margin:0}.controls{padding:14px 10px;border-bottom:1px solid #2b374a}input,select{width:100%;border:1px solid #344157;border-radius:8px;background:#182235;color:#fff;padding:9px;font-size:12px;margin-bottom:8px}.stats{font-size:11px;color:#aeb8c8;margin-top:6px}.qnav{padding:10px 4px}.qbtn{width:100%;border:0;background:transparent;color:#cbd4e2;text-align:left;border-radius:8px;padding:8px 10px;margin:2px 0;cursor:pointer;font-size:12px;line-height:1.35}.qbtn:hover,.qbtn.active{background:var(--dark2);color:#fff}.main{padding:30px;max-width:1250px;width:100%;margin:auto}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}.header h2{margin:0 0 7px;font-size:26px}.header p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:700;text-decoration:none;cursor:pointer;font-size:12px}.secondary{background:#e9eef6;color:var(--ink)}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin:14px 0;box-shadow:0 8px 24px #1018270f}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:11px;background:#fff;margin-right:6px}.question{font-size:20px;font-weight:700;line-height:1.45;margin:12px 0}.meta{color:var(--muted);font-size:13px}.answer{background:#f0fdf4;border:1px solid #bbf7d0;border-left:5px solid var(--green);border-radius:9px;padding:15px;line-height:1.7;font-size:14px}.tip{background:#fff9df;border:1px solid #fde68a;border-left:5px solid #eab308;border-radius:9px;padding:13px;line-height:1.6;font-size:13px}.empty{padding:30px;text-align:center;color:var(--muted)}.hidden{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.main{padding:18px}.header{flex-direction:column}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><h1>SQL DATA ANALYST<br>INTERVIEW PRACTICE</h1><p>155 SQL interview questions • simple answers</p></div><div class="controls"><input id="search" placeholder="Search questions..." aria-label="Search questions"><select id="category"><option value="All">All topics</option></select><select id="difficulty"><option value="All">All difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select><label style="display:flex;align-items:center;gap:7px;font-size:11px;color:#cbd4e2;margin:5px 0"><input id="showAnswers" type="checkbox" checked style="width:auto;margin:0"> Show simple answers</label><div class="stats" id="stats"></div></div><div class="qnav" id="nav"></div></aside><main class="main"><div class="header"><div><h2 id="title">155-Question SQL Interview Bank</h2><p>Q001–Q155 with short, interview-friendly answers. Search or filter by topic and difficulty.</p></div><div class="actions"><a class="btn secondary" href="all_questions.html">📚 Full Question Bank</a></div></div><div id="page"></div></main></div><script>
const CATEGORY=n=>n<=20?'SQL Basics':n<=37?'Joins':n<=53?'GROUP BY / WHERE / HAVING':n<=77?'Window Functions':n<=92?'Date & Time / Streaks':n<=103?'CTE & Subqueries':n<=118?'Advanced Scenarios':n<=130?'Data Quality':n<=143?'Optimization & Data Modeling':'Business Cases';
const DIFF=n=>(n<=20||n>=119&&n<=130)?'Easy':n<=143?'Medium':'Hard';
function simpleAnswer(n,q){
if(n<=20)return 'Use the appropriate basic SQL clause: SELECT for columns, WHERE for row filters, ORDER BY for sorting, GROUP BY for aggregation, HAVING for aggregate filters, and CASE/COALESCE for conditional or NULL handling.';
if(n<=37)return 'Choose the join from the business requirement. INNER JOIN keeps matches, LEFT JOIN keeps every left row, and FULL OUTER JOIN keeps unmatched rows from both sides. Always check the join key and row cardinality.';
if(n<=53)return 'Aggregate at the required business grain with GROUP BY, use SUM/AVG/COUNT as needed, and use HAVING when the condition depends on an aggregate. Use WHERE for row-level filtering before aggregation.';
if(n<=77)return 'Use a window function such as ROW_NUMBER, RANK, DENSE_RANK, LAG, LEAD, or SUM OVER. PARTITION BY defines the group and ORDER BY defines the sequence.';
if(n<=92)return 'Use the database date functions to filter or extract dates. For consecutive activity, use gaps-and-islands logic with deduplicated dates, row numbering, and date arithmetic.';
if(n<=103)return 'Use a CTE or subquery to calculate an intermediate result, then filter, join, aggregate, or rank that result. EXISTS/NOT EXISTS are useful for existence checks.';
if(n<=118)return 'Break the business requirement into smaller steps, usually with CTEs, aggregation, joins, and window functions. Validate the grain at every step and handle ties and NULLs explicitly.';
if(n<=130)return 'Treat the problem as a data-quality check: identify the rule, find invalid records with SQL filters or GROUP BY/HAVING, quantify the issue, then clean or flag the records.';
if(n<=143)return 'Start with the execution plan and data volume. Check filters, joins, indexes, partitioning, selected columns, aggregation, and row counts. Optimize based on measured bottlenecks, not assumptions.';
return 'Start with the business question, define the KPI clearly, break the result down by useful dimensions, validate the source and SQL logic, and explain the result in simple business language.';
}
let BANK=[],filtered=[],current='Q001';const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function parseBank(text){return [...text.matchAll(/^(\d+)\.\s+(.+)$/gm)].map(m=>({n:+m[1],q:m[2].trim()})).filter(x=>x.n<=155).map(x=>({id:`Q${String(x.n).padStart(3,'0')}`,n:x.n,q:x.q,category:CATEGORY(x.n),difficulty:DIFF(x.n),answer:simpleAnswer(x.n,x.q)}));}
async function init(){try{const r=await fetch('QUESTION_BANK.md',{cache:'no-store'});if(!r.ok)throw Error('load failed');BANK=parseBank(await r.text());filtered=[...BANK];const cats=[...new Set(BANK.map(q=>q.category))];cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;document.getElementById('category').appendChild(o)});['search','category','difficulty'].forEach(id=>document.getElementById(id).addEventListener('input',apply));document.getElementById('showAnswers').addEventListener('change',()=>show(current));render()}catch(e){document.getElementById('page').innerHTML='<div class="card empty">Could not load QUESTION_BANK.md. Please refresh after GitHub Pages deployment completes.</div>'}}
function apply(){const s=document.getElementById('search').value.toLowerCase().trim(),c=document.getElementById('category').value,d=document.getElementById('difficulty').value;filtered=BANK.filter(x=>(!s||x.q.toLowerCase().includes(s)||x.id.toLowerCase().includes(s))&&(c==='All'||x.category===c)&&(d==='All'||x.difficulty===d));render()}
function render(){document.getElementById('stats').textContent=`Showing ${filtered.length} of ${BANK.length} questions`;const nav=document.getElementById('nav');nav.innerHTML='';filtered.forEach(q=>{const b=document.createElement('button');b.className='qbtn'+(q.id===current?' active':'');b.textContent=`${q.id} · ${q.q}`;b.onclick=()=>{current=q.id;show(q.id);renderNav()};nav.appendChild(b)});if(filtered.length){if(!filtered.some(x=>x.id===current))current=filtered[0].id;show(current)}else document.getElementById('page').innerHTML='<div class="card empty">No questions match your filters.</div>'}
function renderNav(){document.querySelectorAll('.qbtn').forEach(b=>b.classList.toggle('active',b.textContent.startsWith(current+' · ')))}
function show(id){const q=BANK.find(x=>x.id===id);if(!q)return;current=id;document.getElementById('title').textContent=`${q.id} · ${q.q}`;const visible=document.getElementById('showAnswers').checked;document.getElementById('page').innerHTML=`<div class="card"><span class="badge">${q.category}</span><span class="badge">${q.difficulty}</span><div class="question">🧑‍💼 ${esc(q.q)}</div><div class="meta">Question ${q.n} of 155</div></div><div class="card ${visible?'':'hidden'}"><h3>💡 Simple Answer</h3><div class="answer">${esc(q.answer)}</div></div><div class="card"><h3>🎯 Interview Tip</h3><div class="tip">Say your approach first in 1–2 sentences. Then write the SQL step by step and explain why you chose the clause, join, aggregate, or window function.</div></div>`;renderNav()}
init();</script></body></html>
