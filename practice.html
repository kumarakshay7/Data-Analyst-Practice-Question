const Q=[
{id:'Q001',t:'Salary History: salary never decreases',l:'Medium',topic:'LAG / Window Functions',q:'We have a salary history table. Employees receive salary changes over time. Find employees whose salary never decreased.',simple:'Compare each salary with the previous salary for that employee. If there is even one decrease, exclude that employee.',schema:'salary_history(employee_id, effective_date, salary)',cols:['employee_id','effective_date','salary'],rows:[[101,'2022-01-01',50000],[101,'2023-01-01',55000],[101,'2024-01-01',60000],[102,'2022-01-01',50000],[102,'2023-01-01',60000],[102,'2024-01-01',55000],[103,'2022-01-01',45000],[103,'2023-01-01',45000],[103,'2024-01-01',50000]],setup:"CREATE TABLE salary_history(employee_id INTEGER,effective_date TEXT,salary INTEGER);INSERT INTO salary_history VALUES(101,'2022-01-01',50000),(101,'2023-01-01',55000),(101,'2024-01-01',60000),(102,'2022-01-01',50000),(102,'2023-01-01',60000),(102,'2024-01-01',55000),(103,'2022-01-01',45000),(103,'2023-01-01',45000),(103,'2024-01-01',50000);",sql:"WITH salary_check AS (SELECT employee_id,effective_date,salary,LAG(salary) OVER(PARTITION BY employee_id ORDER BY effective_date) previous_salary FROM salary_history) SELECT employee_id FROM salary_check GROUP BY employee_id HAVING SUM(CASE WHEN previous_salary IS NOT NULL AND salary<previous_salary THEN 1 ELSE 0 END)=0;",out:[['101'],['103']],h1:'How can you get the previous salary for the same employee?',h2:'Use LAG(), PARTITION BY employee_id and ORDER BY effective_date.',exp:'LAG gives the previous salary. The CASE counts decreases. HAVING = 0 keeps employees with no salary decrease.',ans:'I use LAG because I need the previous salary for each employee. I partition by employee and order by effective date, then exclude employees where the current salary is lower than the previous salary.',follow:'What happens to the first salary record for each employee?'},
{id:'Q002',t:'Five consecutive login days',l:'Medium',topic:'ROW_NUMBER / Gaps & Islands',q:'Find users who logged in on at least 5 consecutive days.',simple:'Remove duplicate login dates, number the dates for each user, and group consecutive dates.',schema:'login(userid, logindate)',cols:['userid','logindate'],rows:[[101,'2026-09-01'],[101,'2026-09-02'],[101,'2026-09-03'],[101,'2026-09-04'],[101,'2026-09-05'],[102,'2026-09-01'],[102,'2026-09-02'],[102,'2026-09-04'],[103,'2026-09-10'],[103,'2026-09-11'],[103,'2026-09-12'],[103,'2026-09-13'],[103,'2026-09-14']],setup:"CREATE TABLE login(userid INTEGER,logindate TEXT);INSERT INTO login VALUES(101,'2026-09-01'),(101,'2026-09-02'),(101,'2026-09-03'),(101,'2026-09-04'),(101,'2026-09-05'),(102,'2026-09-01'),(102,'2026-09-02'),(102,'2026-09-04'),(103,'2026-09-10'),(103,'2026-09-11'),(103,'2026-09-12'),(103,'2026-09-13'),(103,'2026-09-14');",sql:"WITH d AS(SELECT DISTINCT userid,logindate FROM login),r AS(SELECT userid,logindate,ROW_NUMBER() OVER(PARTITION BY userid ORDER BY logindate) rn FROM d),g AS(SELECT userid,logindate,date(logindate,printf('-%d day',rn)) grp FROM r) SELECT userid FROM g GROUP BY userid,grp HAVING COUNT(*)>=5;",out:[['101'],['103']],h1:'First make one row per user per day.',h2:'ROW_NUMBER plus date arithmetic creates the consecutive-day group.',exp:'After duplicates are removed, ROW_NUMBER gives 1,2,3... for each user. Subtracting that number of days makes consecutive dates share the same group. Groups with five rows are five-day streaks.',ans:'I remove duplicate login dates first. Then I use ROW_NUMBER and date arithmetic to group consecutive dates, and keep groups with at least five rows.',follow:'Why do we use DISTINCT before ROW_NUMBER?'},
{id:'Q003',t:'Customers who purchased every Electronic product',l:'Medium',topic:'JOIN / GROUP BY / HAVING',q:'Find customers who purchased every product in the Electronic category.',simple:'Count distinct Electronic products bought by each customer and compare that count with the total Electronic product count.',schema:'orders(customer_id, product_id)\nproducts(product_id, category)',cols:['customer_id','product_id'],rows:[[101,'E1'],[101,'E2'],[101,'E3'],[102,'E1'],[102,'E2'],[103,'E1'],[103,'E2'],[103,'E3'],[103,'E3']],setup:"CREATE TABLE products(product_id TEXT,category TEXT);CREATE TABLE orders(customer_id INTEGER,product_id TEXT);INSERT INTO products VALUES('E1','Electronic'),('E2','Electronic'),('E3','Electronic'),('F1','Furniture');INSERT INTO orders VALUES(101,'E1'),(101,'E2'),(101,'E3'),(102,'E1'),(102,'E2'),(103,'E1'),(103,'E2'),(103,'E3'),(103,'E3');",sql:"SELECT o.customer_id FROM orders o JOIN products p ON o.product_id=p.product_id WHERE p.category='Electronic' GROUP BY o.customer_id HAVING COUNT(DISTINCT o.product_id)=(SELECT COUNT(DISTINCT product_id) FROM products WHERE category='Electronic');",out:[['101'],['103']],h1:'Join orders to products and keep only Electronic products.',h2:'COUNT(DISTINCT) for each customer must equal the total Electronic product count.',exp:'The join identifies the category. COUNT(DISTINCT) prevents duplicate purchases from being counted twice. Equal counts mean the customer bought every Electronic product.',ans:'I join orders with products, filter Electronic products, count distinct products for each customer, and compare that count with the total number of Electronic products.',follow:'Why is COUNT(DISTINCT) important?'},
{id:'Q004',t:'Employees earning more than their manager',l:'Easy',topic:'SELF JOIN',q:'Find employees whose salary is higher than their manager salary.',simple:'Use two copies of the employees table: one for the employee and one for the manager.',schema:'employees(employee_id, employee_name, manager_id, salary)',cols:['employee_id','employee_name','manager_id','salary'],rows:[[1,'Amit',null,120000],[2,'Ravi',1,135000],[3,'Neha',1,110000],[4,'Priya',5,90000],[5,'Vikram',null,95000],[6,'Arjun',5,85000]],setup:"CREATE TABLE employees(employee_id INTEGER,employee_name TEXT,manager_id INTEGER,salary INTEGER);INSERT INTO employees VALUES(1,'Amit',NULL,120000),(2,'Ravi',1,135000),(3,'Neha',1,110000),(4,'Priya',5,90000),(5,'Vikram',NULL,95000),(6,'Arjun',5,85000);",sql:"SELECT e.employee_name,e.salary,m.employee_name AS manager_name,m.salary AS manager_salary FROM employees e JOIN employees m ON e.manager_id=m.employee_id WHERE e.salary>m.salary;",out:[['Ravi','135000','Amit','120000']],h1:'Employee and manager are stored in the same table.',h2:'Join employees to itself on manager_id = employee_id.',exp:'The first copy represents the employee. The second copy represents the manager. Then compare the two salary columns.',ans:'I use a self join because employee and manager information is in the same table. Then I compare the employee salary with the manager salary.',follow:'Why is an INNER JOIN enough here?'},
{id:'Q005',t:'Third highest salary',l:'Medium',topic:'DENSE_RANK',q:'Find employees with the third highest distinct salary.',simple:'Rank salaries from highest to lowest. DENSE_RANK keeps tied salaries at the same rank.',schema:'employees(employee_id, employee_name, salary)',cols:['employee_id','employee_name','salary'],rows:[[1,'Amit',120000],[2,'Ravi',135000],[3,'Neha',110000],[4,'Priya',90000],[5,'Vikram',95000],[6,'Arjun',85000]],setup:"CREATE TABLE employees(employee_id INTEGER,employee_name TEXT,salary INTEGER);INSERT INTO employees VALUES(1,'Amit',120000),(2,'Ravi',135000),(3,'Neha',110000),(4,'Priya',90000),(5,'Vikram',95000),(6,'Arjun',85000);",sql:"SELECT employee_id,employee_name,salary FROM(SELECT employee_id,employee_name,salary,DENSE_RANK() OVER(ORDER BY salary DESC) rnk FROM employees)t WHERE rnk=3;",out:[['3','Neha','110000']],h1:'Rank salary from highest to lowest.',h2:'Use DENSE_RANK and filter rank = 3.',exp:'DENSE_RANK gives equal salaries the same rank and does not skip the next rank. This is useful when the question says third highest distinct salary.',ans:'I use DENSE_RANK because the question asks for the third highest distinct salary. Ties receive the same rank.',follow:'What would you use if the interviewer wants exactly the third row?'},
{id:'Q006',t:'Find duplicate customer records',l:'Easy',topic:'GROUP BY / HAVING',q:'Find duplicate customer email addresses.',simple:'Group by email and keep groups that occur more than once.',schema:'customers(customer_id, name, email)',cols:['customer_id','name','email'],rows:[[1,'Amit','amit@mail.com'],[2,'Ravi','ravi@mail.com'],[3,'Amit K','amit@mail.com'],[4,'Neha','neha@mail.com'],[5,'Ravi K','ravi@mail.com']],setup:"CREATE TABLE customers(customer_id INTEGER,name TEXT,email TEXT);INSERT INTO customers VALUES(1,'Amit','amit@mail.com'),(2,'Ravi','ravi@mail.com'),(3,'Amit K','amit@mail.com'),(4,'Neha','neha@mail.com'),(5,'Ravi K','ravi@mail.com');",sql:"SELECT email,COUNT(*) AS occurrences FROM customers GROUP BY email HAVING COUNT(*)>1 ORDER BY email;",out:[['amit@mail.com','2'],['ravi@mail.com','2']],h1:'Group customers by email.',h2:'HAVING COUNT(*) > 1 returns only duplicate emails.',exp:'WHERE filters rows before grouping. HAVING filters groups after GROUP BY, so it is the right place to test duplicate counts.',ans:'I group the customer table by email and use HAVING COUNT(*) greater than one to find duplicate emails.',follow:'How would you return the full duplicate customer rows?'},
{id:'Q007',t:'Top 2 customers by order amount in each category',l:'Medium',topic:'ROW_NUMBER / JOIN / GROUP BY',q:'Find the top 2 customers by total order amount within each product category.',simple:'First total order amount for each customer and category. Then rank customers inside each category.',schema:'orders(customer_id, category, order_amount)',cols:['customer_id','category','order_amount'],rows:[[101,'Electronics',500],[101,'Electronics',300],[102,'Electronics',900],[103,'Electronics',700],[104,'Furniture',800],[105,'Furniture',1200],[106,'Furniture',900]],setup:"CREATE TABLE orders(customer_id INTEGER,category TEXT,order_amount INTEGER);INSERT INTO orders VALUES(101,'Electronics',500),(101,'Electronics',300),(102,'Electronics',900),(103,'Electronics',700),(104,'Furniture',800),(105,'Furniture',1200),(106,'Furniture',900);",sql:"WITH totals AS(SELECT customer_id,category,SUM(order_amount) total_amount FROM orders GROUP BY customer_id,category),r AS(SELECT *,ROW_NUMBER() OVER(PARTITION BY category ORDER BY total_amount DESC,customer_id) rn FROM totals) SELECT customer_id,category,total_amount FROM r WHERE rn<=2 ORDER BY category,total_amount DESC;",out:[['102','Electronics','900'],['101','Electronics','800'],['105','Furniture','1200'],['106','Furniture','900']],h1:'Do not rank individual orders.',h2:'Aggregate first, then use ROW_NUMBER partitioned by category.',exp:'The first step calculates each customer total within a category. The window function then ranks those totals separately for every category.',ans:'I first aggregate order amount by customer and category. Then I use ROW_NUMBER with PARTITION BY category and keep ranks 1 and 2.',follow:'When would you use DENSE_RANK instead of ROW_NUMBER?'},
{id:'Q008',t:'Cumulative salary by department for employees who joined in the last 30 days',l:'Medium',topic:'SUM OVER / Date Filter',q:'For employees who joined in the last 30 days, calculate a cumulative salary department-wise.',simple:'Filter recent joiners first, then use a running SUM partitioned by department.',schema:'employees(employee_id, department, join_date, salary)',cols:['employee_id','department','join_date','salary'],rows:[[1,'Analytics','2026-08-25',60000],[2,'Analytics','2026-09-01',65000],[3,'Analytics','2026-09-15',70000],[4,'Sales','2026-08-20',50000],[5,'Sales','2026-09-05',55000],[6,'Sales','2026-09-18',60000]],setup:"CREATE TABLE employees(employee_id INTEGER,department TEXT,join_date TEXT,salary INTEGER);INSERT INTO employees VALUES(1,'Analytics','2026-08-25',60000),(2,'Analytics','2026-09-01',65000),(3,'Analytics','2026-09-15',70000),(4,'Sales','2026-08-20',50000),(5,'Sales','2026-09-05',55000),(6,'Sales','2026-09-18',60000);",sql:"SELECT employee_id,department,join_date,salary,SUM(salary) OVER(PARTITION BY department ORDER BY join_date,employee_id ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) cumulative_salary FROM employees WHERE join_date>='2026-08-23' ORDER BY department,join_date,employee_id;",out:[['1','Analytics','2026-08-25','60000','60000'],['2','Analytics','2026-09-01','65000','125000'],['3','Analytics','2026-09-15','70000','195000'],['5','Sales','2026-09-05','55000','55000'],['6','Sales','2026-09-18','60000','115000']],h1:'Filter to the recent 30-day period first.',h2:'SUM(...) OVER(PARTITION BY department ORDER BY join_date) creates the running total.',exp:'The WHERE clause keeps employees who joined from 2026-08-23 onward. PARTITION BY department resets the running total for each department.',ans:'I filter the employees who joined in the last 30 days and then use a window SUM partitioned by department and ordered by join date.',follow:'Why is PARTITION BY department needed?'},
{id:'Q009',t:'Week-over-week sales using LAG',l:'Medium',topic:'LAG / Aggregation',q:'Given weekly sales, show the previous week sales and the change from the previous week.',simple:'Use LAG on weekly sales ordered by week.',schema:'weekly_sales(week_start, sales)',cols:['week_start','sales'],rows:[['2026-08-31',10000],['2026-09-07',12000],['2026-09-14',10500],['2026-09-21',14000]],setup:"CREATE TABLE weekly_sales(week_start TEXT,sales INTEGER);INSERT INTO weekly_sales VALUES('2026-08-31',10000),('2026-09-07',12000),('2026-09-14',10500),('2026-09-21',14000);",sql:"SELECT week_start,sales,LAG(sales) OVER(ORDER BY week_start) previous_week_sales,sales-LAG(sales) OVER(ORDER BY week_start) change_from_previous FROM weekly_sales ORDER BY week_start;",out:[['2026-08-31','10000',null,null],['2026-09-07','12000','10000','2000'],['2026-09-14','10500','12000','-1500'],['2026-09-21','14000','10500','3500']],h1:'You need the previous row in date order.',h2:'LAG(sales) returns the previous week sales.',exp:'LAG looks at the previous row without requiring a self join. The first week has no previous week, so it returns NULL.',ans:'I order the weekly data by week_start and use LAG to bring the previous week sales. Then I subtract previous sales from current sales.',follow:'How would you calculate the percentage change?'},
{id:'Q010',t:'Customers without orders',l:'Easy',topic:'LEFT JOIN / NULL',q:'Find customers who have never placed an order.',simple:'Keep every customer with a LEFT JOIN, then find rows where the order is missing.',schema:'customers(customer_id, customer_name)\norders(order_id, customer_id)',cols:['customer_id','customer_name'],rows:[[1,'Amit'],[2,'Ravi'],[3,'Neha'],[4,'Priya']],setup:"CREATE TABLE customers(customer_id INTEGER,customer_name TEXT);CREATE TABLE orders(order_id INTEGER,customer_id INTEGER);INSERT INTO customers VALUES(1,'Amit'),(2,'Ravi'),(3,'Neha'),(4,'Priya');INSERT INTO orders VALUES(1001,1),(1002,3);",sql:"SELECT c.customer_id,c.customer_name FROM customers c LEFT JOIN orders o ON c.customer_id=o.customer_id WHERE o.order_id IS NULL ORDER BY c.customer_id;",out:[['2','Ravi'],['4','Priya']],h1:'Start with customers because you want all customers.',h2:'LEFT JOIN orders and filter WHERE order_id IS NULL.',exp:'LEFT JOIN keeps customers even when no order exists. For customers with no matching order, order columns are NULL.',ans:'I use a LEFT JOIN because I want to keep every customer. Then I filter where the order ID is NULL to find customers with no orders.',follow:'What would happen if we used INNER JOIN?'},
{id:'Q011',t:'WHERE vs HAVING: departments above company average salary',l:'Easy',topic:'WHERE / GROUP BY / HAVING',q:'Find departments whose average salary is greater than the overall company average salary.',simple:'GROUP BY department to calculate department averages, then use HAVING to filter those groups.',schema:'employees(employee_id, department, salary)',cols:['employee_id','department','salary'],rows:[[1,'Analytics',70000],[2,'Analytics',80000],[3,'Sales',50000],[4,'Sales',55000],[5,'HR',60000]],setup:"CREATE TABLE employees(employee_id INTEGER,department TEXT,salary INTEGER);INSERT INTO employees VALUES(1,'Analytics',70000),(2,'Analytics',80000),(3,'Sales',50000),(4,'Sales',55000),(5,'HR',60000);",sql:"SELECT department,AVG(salary) AS avg_salary FROM employees GROUP BY department HAVING AVG(salary)>(SELECT AVG(salary) FROM employees) ORDER BY department;",out:[['Analytics','75000.0']],h1:'WHERE filters individual rows before GROUP BY.',h2:'HAVING filters grouped results after GROUP BY.',exp:'Because AVG(salary) is calculated per department, the condition belongs in HAVING. The company average comes from the subquery.',ans:'WHERE filters rows before aggregation, while HAVING filters groups after aggregation. Here I use HAVING because I am filtering on department-level AVG(salary).',follow:'Can WHERE directly use AVG(salary) in the same query level?'},
{id:'Q012',t:'RANK vs DENSE_RANK vs ROW_NUMBER',l:'Medium',topic:'Window Functions',q:'Show RANK, DENSE_RANK and ROW_NUMBER for employee salaries from highest to lowest.',simple:'Order employees by salary descending and calculate all three window functions so you can see how ties behave.',schema:'employees(employee_id, employee_name, salary)',cols:['employee_id','employee_name','salary'],rows:[[1,'Amit',100000],[2,'Ravi',100000],[3,'Neha',90000],[4,'Priya',80000]],setup:"CREATE TABLE employees(employee_id INTEGER,employee_name TEXT,salary INTEGER);INSERT INTO employees VALUES(1,'Amit',100000),(2,'Ravi',100000),(3,'Neha',90000),(4,'Priya',80000);",sql:"SELECT employee_name,salary,RANK() OVER(ORDER BY salary DESC) rank_no,DENSE_RANK() OVER(ORDER BY salary DESC) dense_rank_no,ROW_NUMBER() OVER(ORDER BY salary DESC,employee_id) row_no FROM employees ORDER BY salary DESC,employee_id;",out:[['Amit','100000','1','1','1'],['Ravi','100000','1','1','2'],['Neha','90000','3','2','3'],['Priya','80000','4','3','4']],h1:'Look at what happens when two employees have the same salary.',h2:'RANK skips numbers after a tie, DENSE_RANK does not, ROW_NUMBER always gives a unique row number.',exp:'Amit and Ravi tie. RANK gives both 1 and then jumps to 3. DENSE_RANK gives both 1 and then 2. ROW_NUMBER gives each row a unique number.',ans:'RANK gives the same rank to ties and skips the next rank. DENSE_RANK gives the same rank but does not skip. ROW_NUMBER always assigns a unique sequence.',follow:'Which function would you use for the third highest distinct salary?'},
{id:'Q013',t:'LEAD and LAG: previous and next week',l:'Medium',topic:'LEAD / LAG',q:'For weekly sales, show previous week sales, next week sales, and current sales minus previous sales.',simple:'Use LAG for the previous row and LEAD for the next row.',schema:'weekly_sales(week_start, sales)',cols:['week_start','sales'],rows:[['2026-09-01',10000],['2026-09-08',12000],['2026-09-15',15000],['2026-09-22',13000]],setup:"CREATE TABLE weekly_sales(week_start TEXT,sales INTEGER);INSERT INTO weekly_sales VALUES('2026-09-01',10000),('2026-09-08',12000),('2026-09-15',15000),('2026-09-22',13000);",sql:"SELECT week_start,sales,LAG(sales) OVER(ORDER BY week_start) previous_sales,LEAD(sales) OVER(ORDER BY week_start) next_sales,sales-LAG(sales) OVER(ORDER BY week_start) change_from_previous FROM weekly_sales ORDER BY week_start;",out:[['2026-09-01','10000',null,'12000',null],['2026-09-08','12000','10000','15000','2000'],['2026-09-15','15000','12000','13000','3000'],['2026-09-22','13000','15000',null,'-2000']],h1:'LAG looks backward. LEAD looks forward.',h2:'Use the same ORDER BY for both functions.',exp:'LAG returns the previous row and LEAD returns the next row in the specified order. The first row has no previous value and the last row has no next value.',ans:'I use LAG to compare with the previous week and LEAD when I also need the next week. Both use ORDER BY week_start.',follow:'What value does LEAD return for the final row?'},
{id:'Q014',t:'CTE vs subquery: employees above department average',l:'Medium',topic:'CTE / Subquery',q:'Find employees whose salary is above the average salary of their own department.',simple:'Calculate the department average and compare each employee salary with that average. A CTE can make the logic easier to read.',schema:'employees(employee_id, employee_name, department, salary)',cols:['employee_id','employee_name','department','salary'],rows:[[1,'Amit','Analytics',70000],[2,'Ravi','Analytics',90000],[3,'Neha','Analytics',80000],[4,'Priya','Sales',50000],[5,'Vikram','Sales',70000]],setup:"CREATE TABLE employees(employee_id INTEGER,employee_name TEXT,department TEXT,salary INTEGER);INSERT INTO employees VALUES(1,'Amit','Analytics',70000),(2,'Ravi','Analytics',90000),(3,'Neha','Analytics',80000),(4,'Priya','Sales',50000),(5,'Vikram','Sales',70000);",sql:"WITH dept_avg AS(SELECT department,AVG(salary) AS avg_salary FROM employees GROUP BY department) SELECT e.employee_id,e.employee_name,e.department,e.salary FROM employees e JOIN dept_avg d ON e.department=d.department WHERE e.salary>d.avg_salary ORDER BY e.employee_id;",out:[['2','Ravi','Analytics','90000'],['5','Vikram','Sales','70000']],h1:'First calculate one average per department.',h2:'Use a CTE to name that intermediate result and join it back to employees.',exp:'A CTE is a named temporary result used by the main query. A subquery can do the same calculation inline. CTEs are often easier to read when a problem has multiple steps.',ans:'I use a CTE because the department average is a separate logical step. Then I join it back to employees and filter salaries above the department average.',follow:'When would a simple subquery be enough?'},
{id:'Q015',t:'How would you optimize a slow SQL query?',l:'Hard',topic:'SQL Optimization',q:'An analytics query on a large table is slow. Explain the practical steps you would take to investigate and improve it.',simple:'Do not immediately rewrite the query. First identify where the time is going, then make one change at a time and measure the result.',schema:'Large fact table: orders(order_id, customer_id, order_date, product_id, amount)\nTypical query: joins, filters, GROUP BY and window functions.',cols:[],rows:[],setup:'',sql:'',out:[],h1:'Think about execution plan, filters, joins, indexes and data volume.',h2:'Measure before and after each change.',exp:'A practical approach is: inspect the execution plan; filter early; select only required columns; check join keys and unexpected row multiplication; use appropriate indexes where the database supports them; reduce unnecessary sorting and repeated calculations; consider partitioning for very large time-based tables; and test the new query against the original result.',ans:'I would first check the execution plan and identify the expensive step. Then I would check filters, joins, indexes, selected columns and row counts. I would make one change at a time and compare execution time and results.',follow:'Why can SELECT * be inefficient on a large table?'},
{id:'Q016',t:'Denormalization for analytics',l:'Medium',topic:'Data Modeling',q:'What is denormalization, and when can it help an analytics workload?',simple:'Think about the trade-off between storage/update complexity and faster analytical reads.',schema:'Normalized example: customers, orders, products, categories\nDenormalized example: an analytics table containing commonly used customer, product, category and order attributes together.',cols:[],rows:[],setup:'',sql:'',out:[],h1:'Normalization reduces repeated data. Denormalization intentionally stores some repeated data.',h2:'Analytics often values fewer joins and simpler reporting queries.',exp:'Denormalization combines data that is frequently queried together, sometimes duplicating attributes. It can help analytics by reducing joins and making dashboard queries simpler or faster. The trade-off is more storage and a need to keep duplicated values consistent.',ans:'Denormalization means intentionally combining or duplicating related data to make reads easier or faster. In analytics, it can help when the same joins are used repeatedly in dashboards or reporting queries.',follow:'What is the main trade-off of denormalization?'},
{id:'Q017',t:'INNER JOIN, LEFT JOIN and FULL OUTER JOIN row-count scenario',l:'Medium',topic:'JOINs',q:'Table A has IDs 1,2,3 and table B has IDs 2,3,4. What rows would INNER JOIN, LEFT JOIN and FULL OUTER JOIN return?',simple:'Match IDs first, then remember what unmatched rows each join keeps.',schema:'A(id) = 1, 2, 3\nB(id) = 2, 3, 4',cols:[],rows:[],setup:'',sql:'',out:[],h1:'INNER keeps matches only. LEFT keeps every row from A. FULL keeps every row from both.',h2:'For these sets, the matching IDs are 2 and 3.',exp:'INNER JOIN returns 2 and 3. LEFT JOIN returns 1,2,3 with NULL values from B for 1. FULL OUTER JOIN returns 1,2,3,4, with NULLs on the side that has no match. SQLite does not directly support FULL OUTER JOIN, so this question is conceptual in this practice lab.',ans:'INNER JOIN keeps only matching IDs. LEFT JOIN keeps all rows from the left table plus matches. FULL OUTER JOIN keeps all rows from both tables and fills missing sides with NULL.',follow:'How many rows would each join return in this example?'},
{id:'Q018',t:'Third highest salary without window functions',l:'Medium',topic:'Subquery',q:'Find the third highest distinct salary without using RANK, DENSE_RANK or ROW_NUMBER.',simple:'Find the maximum salary that is below the second highest salary, using nested MAX logic.',schema:'employees(employee_id, employee_name, salary)',cols:['employee_id','employee_name','salary'],rows:[[1,'Amit',135000],[2,'Ravi',120000],[3,'Neha',120000],[4,'Priya',110000],[5,'Vikram',90000]],setup:"CREATE TABLE employees(employee_id INTEGER,employee_name TEXT,salary INTEGER);INSERT INTO employees VALUES(1,'Amit',135000),(2,'Ravi',120000),(3,'Neha',120000),(4,'Priya',110000),(5,'Vikram',90000);",sql:"SELECT MAX(salary) AS third_highest_salary FROM employees WHERE salary<(SELECT MAX(salary) FROM employees WHERE salary<(SELECT MAX(salary) FROM employees));",out:[['110000']],h1:'Start with the highest salary, then find the highest salary below it.',h2:'Repeat the idea one more time to reach the third distinct salary.',exp:'The innermost MAX finds the highest salary. The middle MAX finds the highest salary below it, which is second highest. The outer MAX finds the highest salary below the second highest, which is third highest.',ans:'I use nested subqueries with MAX. Each level removes the highest salary found so far, allowing me to reach the third distinct salary without a window function.',follow:'How would you return all employees who have the third highest salary?'}
];
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function norm(v){return v===null?'NULL':String(v).trim().replace(/\.0+$/,'')}
function key(rows){return JSON.stringify((rows||[]).map(r=>r.map(norm)).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b))))}
function renderNav(){const nav=document.getElementById('nav');nav.innerHTML='';Q.filter(q=>filter==='All'||q.l===filter).forEach((q)=>{const b=document.createElement('button');b.className='qbtn '+(Q.indexOf(q)===current?'active':'');b.innerHTML=(completed.includes(q.id)?'✓ ':'○ ')+q.id+' · '+esc(q.t);b.onclick=()=>openQ(Q.indexOf(q));nav.appendChild(b)})}
function table(q){if(!q.cols.length)return '<div class="notice">This is a concept question. No runnable sample table is needed.</div>';return '<table class="table"><thead><tr>'+q.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+q.rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function openQ(i){current=i;renderNav();renderQuestion()}
function renderQuestion(){const q=Q[current];document.getElementById('title').textContent=q.id+' · '+q.t;document.getElementById('pill').textContent=q.l+' · '+q.topic;const p=document.getElementById('page');const runnable=!!q.sql;p.innerHTML=`<div class="card"><div class="question">🧑‍💼 Interviewer Question</div><p class="text">${esc(q.q)}</p><h3>What is being asked?</h3><div class="what">${esc(q.simple)}</div></div><div class="card"><h3>📋 Table Structure</h3><div class="schema">${esc(q.schema)}</div><h3 style="margin-top:18px">📊 Sample Data</h3>${table(q)}</div><div class="card"><h3>🤔 Think first</h3><p class="text">Explain your approach in 1–2 sentences before writing SQL.</p><div class="hint"><b>Hint 1:</b> ${esc(q.h1)}</div><div class="hint"><b>Hint 2:</b> ${esc(q.h2)}</div></div><div class="card"><h3>✍️ Write your SQL</h3><textarea id="editor" class="editor" placeholder="Write your SQL query here..."></textarea><div class="actions"><button class="btn run" id="run" ${runnable?'':'disabled'}>▶ Run SQL</button><button class="btn check" id="check" ${runnable?'':'disabled'}>✓ Check Answer</button><button class="btn secondary" id="show">Show Correct Query</button><button class="btn secondary" id="clear">Clear</button></div><div id="result"></div></div><div class="card solution hidden" id="solution"><h3>✅ Correct Query</h3><pre>${esc(q.sql||'This is a conceptual interview question, so focus on the explanation rather than writing a query.')}</pre><h3>📖 Explain every line</h3><ol>${(q.sql?q.sql.split(/\n/):[q.exp]).map((x,i)=>`<li class="text"><code>${esc(x)}</code></li>`).join('')}</ol><h3>💡 Simple Explanation</h3><p class="text">${esc(q.exp)}</p><h3>🎤 Interview Explanation</h3><div class="interview">${esc(q.ans)}</div><h3>🔎 Follow-up Question</h3><p class="text">${esc(q.follow)}</p></div>`;document.getElementById('clear').onclick=()=>{document.getElementById('editor').value='';document.getElementById('result').innerHTML=''};document.getElementById('show').onclick=()=>document.getElementById('solution').classList.remove('hidden');if(runnable){document.getElementById('run').onclick=()=>runSQL(false);document.getElementById('check').onclick=()=>runSQL(true)}else{document.getElementById('run').title='Concept question';document.getElementById('check').title='Concept question'}}
async function getDB(q){if(dbCache[q.id])return dbCache[q.id];if(!SQLLib)SQLLib=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'+f});const d=new SQLLib.Database();if(q.setup)d.run(q.setup);dbCache[q.id]=d;return d}
async function runSQL(check){const q=Q[current],editor=document.getElementById('editor'),result=document.getElementById('result'),user=editor.value.trim();if(!user){result.innerHTML='<div class="error">❌ Please write a SQL query first.</div>';return}try{const d=await getDB(q);const res=d.exec(user);if(!res.length){result.innerHTML='<div class="success">✅ Query executed successfully. No rows returned.</div>';if(check){result.innerHTML+='<div class="error">❌ Query ran, but it did not return the expected result.</div>'}return}const r=res[0];let html='<div class="success">✅ Query executed successfully.</div><div class="result"><table><thead><tr>'+r.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+r.values.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v===null?'NULL':v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';if(check){if(key(r.values)===key(q.out)){html+='<div class="success" style="margin-top:10px">✅ Correct! Your result matches the expected answer.</div>';if(!completed.includes(q.id)){completed.push(q.id);localStorage.setItem('sqlPracticeCompleted',JSON.stringify(completed));renderNav();updateProgress()}}else html+='<div class="error" style="margin-top:10px">❌ Wrong result. Try again, or click <b>Show Correct Query</b> after another attempt.</div>'}result.innerHTML=html}catch(e){result.innerHTML='<div class="error">❌ SQL Error<br><br>'+esc(e.message||e)+'</div>'}}
function updateProgress(){const n=completed.filter(id=>Q.some(q=>q.id===id)).length;document.getElementById('progress').textContent=n+' / '+Q.length+' completed';document.getElementById('bar').style.width=(n/Q.length*100)+'%'}
document.querySelectorAll('.filter button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.filter button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderNav()});
renderNav();updateProgress();openQ(0);
</script>
