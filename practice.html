function solution(q){const n=q.n,t=q.title.toLowerCase();const s={1:'SELECT * FROM employees;',2:'SELECT employee_name,salary FROM employees;',3:'SELECT * FROM employees WHERE salary>50000;',4:"SELECT e.* FROM employees e JOIN departments d ON e.department_id=d.department_id WHERE d.department_name='Analytics';",5:"SELECT * FROM employees WHERE employee_name LIKE 'A%';",6:"SELECT * FROM employees WHERE employee_name LIKE '%an%';",7:'SELECT * FROM employees WHERE salary BETWEEN 50000 AND 100000;',8:'SELECT * FROM employees WHERE department_id IS NULL;',9:"SELECT e.employee_id,e.employee_name,COALESCE(d.department_name,'Unknown') AS department FROM employees e LEFT JOIN departments d ON e.department_id=d.department_id;",10:'SELECT * FROM employees ORDER BY salary DESC;',11:'SELECT * FROM employees ORDER BY salary DESC LIMIT 5;',12:'SELECT COUNT(*) AS employee_count FROM employees;',13:'SELECT AVG(salary) AS average_salary FROM employees;',14:'SELECT MIN(salary) AS min_salary,MAX(salary) AS max_salary FROM employees;',15:'SELECT department_id,COUNT(*) AS employee_count FROM employees GROUP BY department_id;',16:'SELECT department_id,COUNT(*) AS employee_count FROM employees GROUP BY department_id HAVING COUNT(*)>10;',17:'SELECT department_id,SUM(salary) AS total_salary FROM employees GROUP BY department_id;',18:'SELECT department_id,AVG(salary) AS average_salary FROM employees GROUP BY department_id;',19:'SELECT department_id,MAX(salary)-MIN(salary) AS salary_difference FROM employees GROUP BY department_id;',20:"SELECT employee_id,employee_name,salary,CASE WHEN salary<60000 THEN 'Low' WHEN salary<80000 THEN 'Medium' ELSE 'High' END AS salary_band FROM employees;",22:'SELECT DISTINCT c.customer_id,c.customer_name FROM customers c JOIN orders o ON c.customer_id=o.customer_id;',23:'SELECT c.customer_id,c.customer_name FROM customers c LEFT JOIN orders o ON c.customer_id=o.customer_id WHERE o.order_id IS NULL;',24:'SELECT p.product_id,p.product_name FROM products p LEFT JOIN orders o ON p.product_id=o.product_id WHERE o.order_id IS NULL;',25:'SELECT e.employee_id,e.employee_name,d.department_name FROM employees e LEFT JOIN departments d ON e.department_id=d.department_id;',26:'SELECT e.employee_id,e.employee_name FROM employees e LEFT JOIN employees m ON e.manager_id=m.employee_id WHERE e.manager_id IS NOT NULL AND m.employee_id IS NULL;',27:'SELECT e.employee_id,e.employee_name FROM employees e JOIN employees m ON e.manager_id=m.employee_id WHERE e.salary>m.salary;',28:"SELECT DISTINCT o.customer_id FROM orders o JOIN products p ON o.product_id=p.product_id WHERE p.category='Electronics';",29:'SELECT o.* FROM orders o LEFT JOIN products p ON o.product_id=p.product_id WHERE p.product_id IS NULL;',32:'SELECT a.* FROM orders a LEFT JOIN orders b ON a.order_id=b.order_id WHERE b.order_id IS NULL;',33:'SELECT customer_id FROM orders GROUP BY customer_id;',34:'SELECT o.order_id,c.customer_name,p.product_name FROM orders o JOIN customers c ON o.customer_id=c.customer_id JOIN products p ON o.product_id=p.product_id;',35:'SELECT customer_id,product_id,COUNT(*) AS row_count FROM orders GROUP BY customer_id,product_id HAVING COUNT(*)>1;',38:'SELECT strftime(\'%Y-%m\',sale_date) AS month,SUM(amount) AS total_sales FROM sales GROUP BY month;',39:'SELECT customer_id,SUM(amount) AS total_sales FROM sales GROUP BY customer_id;',40:'SELECT customer_id,AVG(amount) AS average_order_value FROM orders GROUP BY customer_id;',41:'SELECT customer_id,COUNT(*) AS order_count FROM orders GROUP BY customer_id HAVING COUNT(*)>5;',42:'SELECT customer_id,SUM(amount) AS total_spend FROM orders GROUP BY customer_id HAVING SUM(amount)>100000;',43:'SELECT category,SUM(amount) AS sales FROM orders GROUP BY category ORDER BY sales DESC LIMIT 1;',44:'SELECT strftime(\'%Y-%m\',order_date) AS month,SUM(amount) revenue FROM orders GROUP BY month ORDER BY revenue DESC LIMIT 1;',45:'SELECT department_id,AVG(salary) avg_salary FROM employees GROUP BY department_id HAVING AVG(salary)>(SELECT AVG(salary) FROM employees);',46:'SELECT product_id,COUNT(*) sales_count FROM orders GROUP BY product_id HAVING COUNT(*)>100;',47:'SELECT customer_id,COUNT(*) order_count FROM orders GROUP BY customer_id HAVING COUNT(*)=1;',48:'SELECT category,COUNT(*) product_count FROM products GROUP BY category HAVING COUNT(*)>=3;',49:'SELECT email,COUNT(*) duplicate_count FROM customers GROUP BY email HAVING COUNT(*)>1;',50:'SELECT customer_name,date_of_birth,COUNT(*) duplicate_count FROM customers GROUP BY customer_name,date_of_birth HAVING COUNT(*)>1;',53:'SELECT department_id,AVG(salary) avg_salary FROM employees GROUP BY department_id HAVING AVG(salary)>(SELECT AVG(salary) FROM employees);',54:'WITH r AS (SELECT e.*,RANK() OVER(PARTITION BY department_id ORDER BY salary DESC) rn FROM employees e) SELECT * FROM r WHERE rn=1;',55:'WITH r AS (SELECT e.*,DENSE_RANK() OVER(PARTITION BY department_id ORDER BY salary DESC) rn FROM employees e) SELECT * FROM r WHERE rn=2;',56:'WITH r AS (SELECT salary,DENSE_RANK() OVER(ORDER BY salary DESC) rn FROM employees) SELECT DISTINCT salary FROM r WHERE rn=3;',58:'SELECT *,ROW_NUMBER() OVER(PARTITION BY department_id ORDER BY salary DESC) rn FROM employees;',59:'WITH x AS (SELECT p.category,o.customer_id,SUM(o.amount) revenue FROM orders o JOIN products p ON o.product_id=p.product_id GROUP BY p.category,o.customer_id),r AS (SELECT *,ROW_NUMBER() OVER(PARTITION BY category ORDER BY revenue DESC) rn FROM x) SELECT * FROM r WHERE rn<=3;',60:'SELECT month,sales,SUM(sales) OVER(ORDER BY month) running_sales FROM monthly_sales;',61:'SELECT employee_id,department_id,salary,SUM(salary) OVER(PARTITION BY department_id ORDER BY employee_id) cumulative_salary FROM employees;',62:'SELECT employee_id,department_id,salary,100.0*salary/SUM(salary) OVER(PARTITION BY department_id) pct_department_salary FROM employees;',63:'SELECT p.product_id,p.category,SUM(o.amount) sales,100.0*SUM(o.amount)/SUM(SUM(o.amount)) OVER(PARTITION BY p.category) pct_category_sales FROM orders o JOIN products p ON o.product_id=p.product_id GROUP BY p.product_id,p.category;',64:'SELECT month,sales,LAG(sales) OVER(ORDER BY month) previous_sales FROM monthly_sales;',65:'SELECT month,sales,LEAD(sales) OVER(ORDER BY month) next_sales FROM monthly_sales;',66:'SELECT month,sales,sales-LAG(sales) OVER(ORDER BY month) mom_change FROM monthly_sales;',67:'SELECT month,sales,100.0*(sales-LAG(sales) OVER(ORDER BY month))/NULLIF(LAG(sales) OVER(ORDER BY month),0) mom_pct_change FROM monthly_sales;',68:'WITH x AS (SELECT employee_id,effective_date,salary,LAG(salary) OVER(PARTITION BY employee_id ORDER BY effective_date) prev FROM salary_history) SELECT * FROM x WHERE prev IS NOT NULL AND salary>prev;',69:'WITH x AS (SELECT employee_id,effective_date,salary,LAG(salary) OVER(PARTITION BY employee_id ORDER BY effective_date) prev FROM salary_history) SELECT employee_id FROM x GROUP BY employee_id HAVING SUM(CASE WHEN prev IS NOT NULL AND salary<prev THEN 1 ELSE 0 END)=0;',70:'WITH r AS (SELECT o.*,ROW_NUMBER() OVER(PARTITION BY customer_id ORDER BY order_date) rn FROM orders o) SELECT * FROM r WHERE rn=1;',71:'WITH r AS (SELECT o.*,ROW_NUMBER() OVER(PARTITION BY customer_id ORDER BY order_date DESC) rn FROM orders o) SELECT * FROM r WHERE rn=1;',72:'WITH r AS (SELECT o.*,ROW_NUMBER() OVER(PARTITION BY customer_id ORDER BY order_date) rn FROM orders o) SELECT * FROM r WHERE rn=2;',73:'WITH x AS (SELECT o.*,LAG(order_date) OVER(PARTITION BY customer_id ORDER BY order_date) prev_date FROM orders o) SELECT *,julianday(order_date)-julianday(prev_date) gap_days FROM x WHERE prev_date IS NOT NULL;',74:'WITH x AS (SELECT p.category,o.customer_id,SUM(o.amount) revenue FROM orders o JOIN products p ON o.product_id=p.product_id GROUP BY p.category,o.customer_id),r AS (SELECT *,ROW_NUMBER() OVER(PARTITION BY category ORDER BY revenue DESC) rn FROM x) SELECT * FROM r WHERE rn<=2;',76:'WITH w AS (SELECT strftime(\'%Y-%W\',sale_date) week,SUM(amount) sales FROM sales GROUP BY week) SELECT week,sales,sales-LAG(sales) OVER(ORDER BY week) wow_change FROM w;',77:'WITH w AS (SELECT strftime(\'%Y-%W\',sale_date) week,SUM(amount) sales FROM sales GROUP BY week) SELECT week,sales,LAG(sales) OVER(ORDER BY week) previous_sales,LEAD(sales) OVER(ORDER BY week) next_sales FROM w;',85:'WITH d AS (SELECT DISTINCT user_id,login_date FROM logins),x AS (SELECT user_id,login_date,julianday(login_date)-ROW_NUMBER() OVER(PARTITION BY user_id ORDER BY login_date) grp FROM d) SELECT user_id FROM x GROUP BY user_id,grp HAVING COUNT(*)>=5;',89:'SELECT customer_id,MIN(order_date) first_order_date,MAX(order_date) last_order_date FROM orders GROUP BY customer_id;',93:'SELECT * FROM employees WHERE salary>(SELECT AVG(salary) FROM employees);',94:'SELECT e.* FROM employees e WHERE e.salary>(SELECT AVG(e2.salary) FROM employees e2 WHERE e2.department_id=e.department_id);',98:'SELECT c.* FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id=c.customer_id);',99:'SELECT c.* FROM customers c WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id=c.customer_id);',103:'SELECT DISTINCT salary FROM employees e WHERE 2=(SELECT COUNT(DISTINCT e2.salary) FROM employees e2 WHERE e2.salary>e.salary);',104:"SELECT o.customer_id FROM orders o JOIN products p ON o.product_id=p.product_id WHERE p.category='Electronics' GROUP BY o.customer_id HAVING COUNT(DISTINCT o.product_id)=(SELECT COUNT(DISTINCT product_id) FROM products WHERE category='Electronics');",105:'WITH x AS (SELECT p.category,o.customer_id,SUM(o.amount) revenue FROM orders o JOIN products p ON o.product_id=p.product_id GROUP BY p.category,o.customer_id),r AS (SELECT *,ROW_NUMBER() OVER(PARTITION BY category ORDER BY revenue DESC) rn FROM x) SELECT * FROM r WHERE rn<=2;',119:'SELECT * FROM employees WHERE employee_name IS NULL OR salary IS NULL OR department_id IS NULL;',120:'SELECT employee_id,COUNT(*) FROM employees GROUP BY employee_id HAVING COUNT(*)>1;',121:'SELECT customer_id,COUNT(*) FROM customers GROUP BY customer_id HAVING COUNT(*)>1;',122:'SELECT * FROM orders WHERE amount<0;',124:'SELECT o.* FROM orders o LEFT JOIN products p ON o.product_id=p.product_id WHERE p.product_id IS NULL;',125:"SELECT * FROM customers WHERE email NOT LIKE '%_@_%._%';",126:'SELECT * FROM customers WHERE customer_name<>TRIM(customer_name);',129:'SELECT customer_name,date_of_birth,COUNT(*) FROM customers GROUP BY customer_name,date_of_birth HAVING COUNT(*)>1;',130:'SELECT o.customer_id,COUNT(*) order_rows,COUNT(DISTINCT o.order_id) distinct_orders FROM orders o GROUP BY o.customer_id HAVING COUNT(*)<>COUNT(DISTINCT o.order_id);'};return s[n]||'';}
function render(){const s=document.getElementById('search').value.toLowerCase().trim(),d=document.getElementById('difficulty').value;const arr=BANK.filter(q=>(mode==='practice'?practicalIds.has(q.n):!practicalIds.has(q.n))&&(!s||q.title.toLowerCase().includes(s)||q.id.toLowerCase().includes(s))&&(d==='All'||q.difficulty===d));document.getElementById('stats').textContent=(mode==='practice'?'Practical: ':'Theory: ')+arr.length+' questions';document.getElementById('nav').innerHTML=arr.map(q=>'<button class="qbtn '+(current&&current.n===q.n?'active':'')+'" onclick="show('+q.n+')">'+esc(q.id+' · '+q.title)+'</button>').join('');if(arr.length){if(!current||!arr.some(q=>q.n===current.n))show(arr[0].n);else show(current.n)}else document.getElementById('page').innerHTML='<div class="card">No questions found.</div>';}
function show(n){current=BANK.find(q=>q.n===n);if(!current)return;document.getElementById('title').textContent=current.id+' · '+current.title;if(mode==='theory'){document.getElementById('page').innerHTML='<div class="card"><span class="badge">Theory</span><span class="badge">'+current.difficulty+'</span><div class="question">🧑‍💼 '+esc(current.title)+'</div></div><div class="card"><h3>💡 Simple answer</h3><div class="answer">'+esc(simple(current.title))+'</div></div><div class="card"><h3>🎯 Interview tip</h3><div class="hint">Explain the concept first. If the interviewer asks you to write SQL, use the Practical SQL section for hands-on practice.</div></div>';return}const m=meta(current);const sol=solution(current);document.getElementById('page').innerHTML='<div class="card"><span class="badge">Practical SQL</span><span class="badge">'+current.difficulty+'</span><div class="question">🧑‍💼 '+esc(current.title)+'</div><p class="meta">Write your query before looking at the solution.</p></div><div class="card"><h3>📋 Table Structure</h3><div class="schema">'+esc(m[0])+'</div><h3>🤔 Think first</h3><div class="hint">'+esc(m[1])+'</div><h3>✍️ Write your SQL</h3><textarea id="editor" class="editor" spellcheck="false"></textarea><div class="buttons"><button class="btn run" onclick="runSql()">▶ Run SQL</button><button class="btn check" onclick="checkSql()">✓ Check Answer</button><button class="btn show" onclick="showSql()">Show Correct Query</button><button class="btn clear" onclick="clearSql()">Clear</button></div><div id="result"></div></div>'}
function runSql(){try{if(!DB)return msg('SQL engine is still loading. Please wait a moment and run again.');const sql=document.getElementById('editor').value.trim();if(!sql)return msg('Write a SQL query first.');const r=DB.exec(sql);document.getElementById('result').innerHTML='<div class="result ok">✅ Query executed successfully.</div>'+(r.length?table(r[0]):'')}catch(e){msg(e.message)}}
function table(r){return '<div class="tablewrap"><table class="resulttable"><thead><tr>'+r.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+r.values.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function checkSql(){if(!DB)return msg('SQL engine is still loading. Please wait a moment.');const sol=solution(current);if(!sol)return msg('A fixed checker is not configured for this question yet. You can still use Run SQL to practice your query.');try{const a=DB.exec(document.getElementById('editor').value.trim()),b=DB.exec(sol);const av=JSON.stringify(a[0]?.values||[]),bv=JSON.stringify(b[0]?.values||[]);if(av===bv)document.getElementById('result').innerHTML='<div class="result ok">✅ Correct result!</div>';else msg('The result does not match the expected output. Check your logic.')}catch(e){msg(e.message)}}
function showSql(){const s=solution(current);if(s)document.getElementById('editor').value=s;else msg('Correct SQL is not configured for this question yet. Use the table structure and hint to write your own query.')}
function clearSql(){document.getElementById('editor').value='';document.getElementById('result').innerHTML=''}function msg(s){document.getElementById('result').innerHTML='<div class="result err">❌ '+esc(s)+'</div>'}
document.getElementById('practiceTab').onclick=()=>{mode='practice';document.getElementById('practiceTab').classList.add('active');document.getElementById('theoryTab').classList.remove('active');current=null;render()};document.getElementById('theoryTab').onclick=()=>{mode='theory';document.getElementById('theoryTab').classList.add('active');document.getElementById('practiceTab').classList.remove('active');current=null;render()};document.getElementById('search').oninput=render;document.getElementById('difficulty').onchange=render;
async function initDb(){try{SQL=await initSqlJs({locateFile:file=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/'+file});DB=new SQL.Database();const r=await fetch('datasets/practice_seed.sql',{cache:'no-store'});if(!r.ok)throw new Error('Could not load practice database.');const seed=await r.text();DB.run(seed)}catch(e){console.error(e);}}
async function boot(){const bankPromise=fetch('QUESTION_BANK.md',{cache:'no-store'}).then(r=>r.text());const dbPromise=initDb();const t=await bankPromise;for(const l of t.split(/\r?\n/)){const m=l.match(/^\s*(\d+)\.\s+(.+)$/);if(m&&+m[1]<=172)BANK.push({n:+m[1],id:'Q'+String(m[1]).padStart(3,'0'),title:m[2].trim(),difficulty:diff(+m[1])})}await dbPromise;render();}boot();
