<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SQL Data Analyst Interview Practice</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f8fb;color:#172033}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:24px;position:sticky;top:0;height:100vh}.side h1{font-size:20px;margin:0 0 8px}.side p{font-size:13px;color:#aab3c5}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d9deea;padding:11px 12px;border-radius:8px;margin:5px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#263247;color:#fff}.main{padding:30px;max-width:1200px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.badge{padding:6px 10px;border-radius:20px;background:#fff;border:1px solid #dce2ea;font-size:12px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:12px;padding:22px;margin:18px 0;box-shadow:0 2px 8px #00000008}.question{font-size:18px;line-height:1.6}.schema{background:#111827;color:#e8edf7;padding:15px;border-radius:8px;overflow:auto}.hint{background:#fff8df;border-left:4px solid #e6b800;padding:12px;margin:10px 0}.editor{width:100%;min-height:220px;background:#0b1220;color:#e8edf7;border:0;border-radius:8px;padding:16px;font-family:Consolas,monospace;font-size:14px;resize:vertical}.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600}.primary{background:#2563eb;color:white}.secondary{background:#e9eef7;color:#172033}.success{background:#dcfce7;border:1px solid #86efac;padding:14px;border-radius:8px}.error{background:#fee2e2;border:1px solid #fca5a5;padding:14px;border-radius:8px}.solution{display:none}.solution pre,.output pre{background:#0b1220;color:#e8edf7;padding:15px;border-radius:8px;overflow:auto}.small{font-size:13px;color:#687386}.progress{height:7px;background:#293548;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:#60a5fa;width:0}.question-list{max-height:55vh;overflow:auto}.qitem{font-size:12px}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.main{padding:18px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><h1>SQL Interview Lab</h1><p>Practice SQL like a real Data Analyst interview.</p><div class="progress"><span id="progressBar"></span></div><p id="progressText">0 / 10 completed</p><div class="nav" id="nav"></div></aside>
<main class="main"><div class="top"><div><h2 id="title">SQL Data Analyst Interview Practice</h2><p class="small">Write first. Check later. Learn from every mistake.</p></div><span class="badge" id="topic"></span></div><div id="content"></div></main>
</div>
<script>
const questions=[
{id:'Q001',title:'Salary never decreases',level:'Medium',topic:'LAG / Window Functions',question:'We have salary_history with employee_id, effective_date and salary. Employees can receive salary changes over time. Find employees whose salary never decreased.',schema:'salary_history(employee_id, effective_date, salary)',hint1:'How can you get the previous salary for the same employee?',hint2:'Use LAG(), partition by employee_id and order by effective_date.',sql:`WITH salary_check AS (\n    SELECT employee_id, effective_date, salary,\n           LAG(salary) OVER (\n               PARTITION BY employee_id\n               ORDER BY effective_date\n           ) AS previous_salary\n    FROM salary_history\n)\nSELECT employee_id\nFROM salary_check\nGROUP BY employee_id\nHAVING SUM(CASE WHEN previous_salary IS NOT NULL AND salary < previous_salary THEN 1 ELSE 0 END) = 0;`,explain:'LAG gives the previous salary. We compare the current salary with it. If an employee has even one decrease, the CASE counts it. HAVING = 0 keeps employees with no decrease.',interview:'I use LAG because I need the previous salary for each employee. I partition by employee and order by effective date, then check whether the current salary is lower than the previous salary.'},
{id:'Q002',title:'Five consecutive login days',level:'Medium',topic:'Gaps and Islands',question:'The login table has userid and logindate. Find users who logged in on at least 5 consecutive days.',schema:'login(userid, logindate)',hint1:'First remove duplicate dates for the same user.',hint2:'Use ROW_NUMBER() and date arithmetic to create a group for consecutive dates.',sql:`WITH distinct_login AS (\n    SELECT DISTINCT userid, logindate\n    FROM login\n), login_group AS (\n    SELECT userid, logindate,\n           logindate - ROW_NUMBER() OVER (PARTITION BY userid ORDER BY logindate) * INTERVAL '1 day' AS grp\n    FROM distinct_login\n)\nSELECT userid\nFROM login_group\nGROUP BY userid, grp\nHAVING COUNT(*) >= 5;`,explain:'After removing duplicates, ROW_NUMBER gives 1,2,3... for each user. Subtracting those numbers from consecutive dates produces the same group value. A group with 5 rows means 5 consecutive days.',interview:'I remove duplicate login dates first. Then I use ROW_NUMBER and date arithmetic to group consecutive dates, and finally keep groups with at least five days.'},
{id:'Q003',title:'Customers who purchased every Electronic product',level:'Medium',topic:'JOIN / GROUP BY / HAVING',question:'Orders has customer_id and product_id. Products has product_id and category. Find customers who purchased every product in the Electronic category.',schema:'orders(customer_id, product_id)\nproducts(product_id, category)',hint1:'Join orders to products and keep only Electronic products.',hint2:'Count distinct products for each customer and compare it with the total number of Electronic products.',sql:`SELECT o.customer_id\nFROM orders o\nJOIN products p ON o.product_id = p.product_id\nWHERE p.category = 'Electronic'\nGROUP BY o.customer_id\nHAVING COUNT(DISTINCT o.product_id) = (\n    SELECT COUNT(DISTINCT product_id)\n    FROM products\n    WHERE category = 'Electronic'\n);`,explain:'We count unique Electronic products bought by each customer. Then we compare that count with the total number of Electronic products. Equal counts mean the customer bought all of them.',interview:'I join orders with products to identify Electronic products, count distinct products for each customer, and compare that count with the total number of Electronic products.'},
{id:'Q004',title:'Employees earning more than their manager',level:'Easy',topic:'SELF JOIN',question:'Find employees whose salary is higher than their manager salary.',schema:'employees(employee_id, employee_name, manager_id, salary)',hint1:'The employee and manager are in the same table.',hint2:'Join employees to itself using employee.manager_id = manager.employee_id.',sql:`SELECT e.employee_name, e.salary, m.employee_name AS manager_name, m.salary AS manager_salary\nFROM employees e\nJOIN employees m ON e.manager_id = m.employee_id\nWHERE e.salary > m.salary;`,explain:'This is a self join because both employees and managers are stored in the same table. One copy represents the employee and the other represents the manager.',interview:'I use a self join because employee and manager information is in the same table. Then I compare the employee salary with the manager salary.'},
{id:'Q005',title:'Third highest salary',level:'Medium',topic:'DENSE_RANK',question:'Find employees with the third highest distinct salary.',schema:'employees(employee_id, employee_name, salary)',hint1:'Rank salaries from highest to lowest.',hint2:'Use DENSE_RANK so tied salaries share the same rank.',sql:`SELECT employee_id, employee_name, salary\nFROM (\n    SELECT employee_id, employee_name, salary,\n           DENSE_RANK() OVER (ORDER BY salary DESC) AS rnk\n    FROM employees\n) t\nWHERE rnk = 3;`,explain:'DENSE_RANK gives the same rank to equal salaries and does not skip the next rank.',interview:'I use DENSE_RANK because the question asks for the third highest distinct salary and ties should receive the same rank.'},
{id:'Q006',title:'Find duplicate customer records',level:'Easy',topic:'GROUP BY / HAVING',question:'Find duplicate customer email addresses in the customers table.',schema:'customers(customer_id, name, email)',hint1:'Group records by the field that should be unique.',hint2:'Use HAVING COUNT(*) > 1.',sql:`SELECT email, COUNT(*) AS duplicate_count\nFROM customers\nGROUP BY email\nHAVING COUNT(*) > 1;`,explain:'GROUP BY puts the same email values together. HAVING keeps only groups that appear more than once.',interview:'I group by email and use HAVING COUNT greater than one to identify duplicate emails.'},
{id:'Q007',title:'Top 2 customers in each category',level:'Medium',topic:'WINDOW + AGGREGATION',question:'Find the top 2 customers by total order amount within each product category.',schema:'orders(customer_id, category, order_amount)',hint1:'First calculate total amount for each customer and category.',hint2:'Then rank customers inside each category.',sql:`SELECT category, customer_id, total_amount\nFROM (\n    SELECT category, customer_id, SUM(order_amount) AS total_amount,\n           DENSE_RANK() OVER (PARTITION BY category ORDER BY SUM(order_amount) DESC) AS rnk\n    FROM orders\n    GROUP BY category, customer_id\n) t\nWHERE rnk <= 2;`,explain:'First aggregate order amount at customer-category level. Then use DENSE_RANK partitioned by category to find the top two customers in each category.',interview:'I aggregate the order amount first because ranking raw orders would rank individual transactions, not customers.'},
{id:'Q008',title:'Cumulative salary by department',level:'Medium',topic:'RUNNING TOTAL',question:'For employees who joined in the last 30 days, calculate cumulative salary department-wise ordered by joining date.',schema:'employees(employee_id, department, salary, joining_date)',hint1:'Filter recent joiners first.',hint2:'Use SUM() OVER with PARTITION BY department and ORDER BY joining_date.',sql:`SELECT employee_id, department, salary, joining_date,\n       SUM(salary) OVER (\n           PARTITION BY department\n           ORDER BY joining_date\n           ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n       ) AS cumulative_salary\nFROM employees\nWHERE joining_date >= CURRENT_DATE - INTERVAL '30 days';`,explain:'The window SUM creates a running total. PARTITION BY restarts the total for every department.',interview:'I filter the last 30 days first, then use a window SUM partitioned by department and ordered by joining date to create the cumulative salary.'},
{id:'Q009',title:'Week-over-week sales',level:'Medium',topic:'LAG',question:'Given weekly sales, show the previous week sales and the change from the previous week.',schema:'weekly_sales(week, sales)',hint1:'You need the previous row.',hint2:'Use LAG(sales) ordered by week.',sql:`SELECT week, sales,\n       LAG(sales) OVER (ORDER BY week) AS previous_week_sales,\n       sales - LAG(sales) OVER (ORDER BY week) AS sales_change\nFROM weekly_sales;`,explain:'LAG moves one row backward, so it gives the previous week value. Subtracting it from the current sales gives the change.',interview:'I use LAG because week-over-week analysis requires the current week compared with the previous week.'},
{id:'Q010',title:'Customers without orders',level:'Easy',topic:'LEFT JOIN / NULL',question:'Find customers who have never placed an order.',schema:'customers(customer_id, name)\norders(order_id, customer_id)',hint1:'Keep every customer, even if no matching order exists.',hint2:'Use LEFT JOIN and filter where the order side is NULL.',sql:`SELECT c.customer_id, c.name\nFROM customers c\nLEFT JOIN orders o ON c.customer_id = o.customer_id\nWHERE o.customer_id IS NULL;`,explain:'LEFT JOIN keeps all customers. Customers without a matching order have NULL values on the order side, so the NULL filter identifies them.',interview:'I use a LEFT JOIN because I want to keep all customers and then find the ones with no matching order.'}
];
let current=0,completed=JSON.parse(localStorage.getItem('sqlProgress')||'[]');
function renderNav(){document.getElementById('nav').innerHTML=questions.map((q,i)=>`<button class="qitem ${i===current?'active':''}" onclick="openQ(${i})">${completed.includes(q.id)?'✅':'○'} ${q.id} · ${q.title}</button>`).join('');document.getElementById('progressBar').style.width=(completed.length/questions.length*100)+'%';document.getElementById('progressText').textContent=`${completed.length} / ${questions.length} completed`;}
function openQ(i){current=i;renderNav();renderQuestion();}
function renderQuestion(){let q=questions[current];document.getElementById('title').textContent=q.id+' · '+q.title;document.getElementById('topic').textContent=q.level+' · '+q.topic;document.getElementById('content').innerHTML=`<div class="card"><div class="question"><strong>🧑‍💼 Interviewer Question</strong><p>${q.question}</p></div><h3>Table Structure</h3><pre class="schema">${q.schema}</pre><h3>🤔 Think first</h3><p class="small">Don't look at the solution yet. Try to explain your approach in 1–2 sentences.</p><div class="hint"><b>Hint 1:</b> ${q.hint1}</div><div class="hint"><b>Hint 2:</b> ${q.hint2}</div></div><div class="card"><h3>✍️ Write your SQL</h3><textarea id="editor" class="editor" spellcheck="false">-- Write your query here\nSELECT</textarea><div class="actions"><button class="btn primary" onclick="checkAnswer()">Check Answer</button><button class="btn secondary" onclick="runQuery()">Run Query</button><button class="btn secondary" onclick="showSolution()">Show Correct Query</button></div><div id="result" style="margin-top:14px"></div></div><div class="card solution" id="solution"><h3>✅ Correct Query</h3><pre>${escapeHtml(q.sql)}</pre><h3>🧠 Simple Explanation</h3><p>${q.explain}</p><h3>🎤 Natural Interview Answer</h3><p>"${q.interview}"</p><h3>🔁 Follow-up question</h3><p>Why did you choose this function or approach instead of another SQL method?</p></div>`;}
function escapeHtml(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');}
function normalize(s){return s.toLowerCase().replace(/--.*$/gm,'').replace(/\s+/g,' ').replace(/;$/,'').trim();}
function checkAnswer(){let user=normalize(document.getElementById('editor').value),expected=normalize(questions[current].sql);let result=document.getElementById('result');if(user.length<10||user==='select'){result.innerHTML='<div class="error">❌ Please write the query first. Use the hints if you are stuck.</div>';return}if(user===expected||user.replace(/\s/g,'')===expected.replace(/\s/g,'')){if(!completed.includes(questions[current].id)){completed.push(questions[current].id);localStorage.setItem('sqlProgress',JSON.stringify(completed));}result.innerHTML='<div class="success">✅ Correct! Great job. Now click <b>Show Correct Query</b> and compare your approach.</div>';renderNav();}else{result.innerHTML='<div class="error">❌ Not matching the expected solution yet. Try again. Use Hint 1 and Hint 2 before revealing the answer.</div>';}}
function showSolution(){document.getElementById('solution').style.display='block';}
function runQuery(){document.getElementById('result').innerHTML='<div class="hint">▶️ The browser runner is configured for PostgreSQL-style questions. For this first version, use <b>Check Answer</b> to validate the interview solution. The next version can add full client-side SQL execution with sample datasets.</div>';}
renderNav();renderQuestion();
</script>
</body>
</html>
