name: Build Python Question Bank

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-python:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Python practice page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          p = Path('python_practice.html')
          old = p.read_text(encoding='utf-8')

          mt = re.search(r'const theory=(\[.*?\]);\s*const practical=', old, re.S)
          mp = re.search(r'const practical=(\[.*?\]);\s*let mode=', old, re.S)
          if not mt or not mp:
              raise SystemExit('Could not locate Python question arrays')

          theory = mt.group(1)
          practical = mp.group(1)

          extra_theory = [
            ['PY-T051','What is the difference between shallow copy and deep copy in Python?','Medium','A shallow copy creates a new outer object but keeps references to nested objects. A deep copy recursively copies nested objects. Use copy.copy() for shallow copy and copy.deepcopy() when independent nested data is required.'],
            ['PY-T052','What are *args and **kwargs?','Medium','*args collects extra positional arguments into a tuple, while **kwargs collects extra keyword arguments into a dictionary. They are useful when a function needs a flexible number of inputs.'],
            ['PY-T053','What is an iterator and what is a generator?','Medium','An iterator produces values one at a time through __next__(). A generator is a convenient way to create an iterator using yield. Generators are memory efficient for large sequences.'],
            ['PY-T054','What is the difference between a generator and a list comprehension?','Medium','A list comprehension creates the complete list in memory. A generator expression produces values lazily, so it can use much less memory for large data.'],
            ['PY-T055','What is a decorator in Python?','Hard','A decorator wraps a function or class to add behavior without changing its core implementation. It is commonly written with the @decorator syntax.'],
            ['PY-T056','What is object-oriented programming in Python?','Medium','OOP organizes code around classes and objects. Python supports encapsulation through conventions, inheritance, polymorphism, and abstraction patterns.'],
            ['PY-T057','What is the difference between class variables and instance variables?','Medium','A class variable is shared by instances of a class. An instance variable belongs to a particular object and is normally created through self.'],
            ['PY-T058','What is the difference between @staticmethod, @classmethod, and an instance method?','Hard','An instance method receives self. A class method receives cls and can operate on class-level state. A static method receives neither automatically and behaves like a function grouped inside the class.'],
            ['PY-T059','What is a context manager and why is with used?','Hard','A context manager controls setup and cleanup around a block. The with statement ensures cleanup such as closing a file even when an exception occurs.'],
            ['PY-T060','How does Python manage memory at a high level?','Hard','Python manages object memory automatically. Reference counting and a cyclic garbage collector help reclaim objects that are no longer reachable.'],
            ['PY-T061','What is the GIL and why can it matter for CPU-bound work?','Hard','In the common CPython implementation, the Global Interpreter Lock allows only one thread to execute Python bytecode at a time. CPU-bound workloads may therefore benefit from multiprocessing or native/vectorized libraries.'],
            ['PY-T062','What is the difference between multiprocessing and multithreading?','Hard','Threads share a process and are useful for many I/O-bound tasks. Processes have separate memory spaces and can use multiple CPU cores more directly for CPU-bound Python work.'],
            ['PY-T063','How do you profile a slow Python program?','Hard','Measure before optimizing. Use tools such as timeit for small sections and cProfile or profiling libraries for broader execution analysis, then optimize the actual bottleneck.'],
            ['PY-T064','What is Big O complexity and why is it useful in Python?','Medium','Big O describes how runtime or memory grows as input size increases. It helps compare algorithms and identify inefficient loops, searches, sorting, or repeated operations.'],
            ['PY-T065','How would you process a CSV file too large to fit in memory?','Hard','Read only required columns, use efficient dtypes, process the file in chunks with pandas read_csv(chunksize=...), aggregate incrementally, or move the workload to a database or distributed engine when appropriate.'],
            ['PY-T066','How would you handle a Pandas DataFrame with 10 million rows?','Hard','Profile memory and operations first. Select needed columns, optimize dtypes, avoid row-wise loops, use vectorization and chunking, and consider SQL, Polars, Dask, Spark, or another scalable approach when the workload exceeds local-memory limits.'],
            ['PY-T067','How do you validate a data transformation in Python?','Hard','Check row counts, uniqueness, nulls, ranges, totals, join cardinality, and business rules before and after the transformation. Add assertions or automated tests for critical rules.'],
            ['PY-T068','How would you avoid data leakage in a machine-learning preprocessing pipeline?','Hard','Fit transformations such as imputation, scaling, or encoding only on training data, then apply the fitted transformation to validation and test data. Use pipeline abstractions to keep the order consistent.'],
            ['PY-T069','How would you make a Python data pipeline production-ready?','Hard','Separate configuration from code, validate inputs, use logging and error handling, make transformations testable, control dependencies, monitor data quality and runtime, and make reruns safe and reproducible.'],
            ['PY-T070','How would you debug a Python data-analysis result that suddenly changed?','Hard','Compare input versions, schema, row counts, filters, joins, null handling, date logic, aggregation levels, and code changes. Reproduce the result on a small sample and validate intermediate outputs before changing the final calculation.']
          ]

          extra_practical = [
            ['PY-P041','Use a dictionary to calculate the frequency of each word in a sentence.','Medium','text="data analysis data python"\ncounts={}\nfor word in text.split():\n    counts[word]=counts.get(word,0)+1\nprint(counts)'],
            ['PY-P042','Find the second-largest unique number in a list.','Medium','values=[10,40,20,40,30]\nprint(sorted(set(values),reverse=True)[1])'],
            ['PY-P043','Flatten a list of lists into one list.','Easy','values=[[1,2],[3,4],[5]]\nprint([x for group in values for x in group])'],
            ['PY-P044','Create a function that returns the number of vowels in a string.','Easy','def count_vowels(text):\n    return sum(ch.lower() in "aeiou" for ch in text)\nprint(count_vowels("Data Analyst"))'],
            ['PY-P045','Find employees whose salary is above the department average using Pandas.','Hard','import pandas as pd\ndf=pd.DataFrame({"department":["IT","IT","HR","HR"],"name":["A","B","C","D"],"salary":[50000,80000,60000,40000]})\ndf["dept_avg"]=df.groupby("department")["salary"].transform("mean")\nprint(df[df["salary"]>df["dept_avg"]])'],
            ['PY-P046','Find the second-highest salary in each department.','Hard','import pandas as pd\ndf=pd.DataFrame({"department":["IT","IT","IT","HR","HR"],"salary":[50000,80000,70000,60000,55000]})\ndf["rank"]=df.groupby("department")["salary"].rank(method="dense",ascending=False)\nprint(df[df["rank"]==2])'],
            ['PY-P047','Calculate a 3-period rolling average of sales.','Medium','import pandas as pd\ndf=pd.DataFrame({"sales":[100,120,150,180,200]})\ndf["rolling_avg"]=df["sales"].rolling(3).mean()\nprint(df)'],
            ['PY-P048','Calculate a 7-day rolling average for daily sales.','Medium','import pandas as pd\ndf=pd.DataFrame({"date":pd.date_range("2026-01-01",periods=10),"sales":[10,12,11,14,15,13,16,18,17,20]})\ndf["rolling_7d"]=df["sales"].rolling(7).mean()\nprint(df)'],
            ['PY-P049','Find the first purchase date for each customer.','Medium','import pandas as pd\ndf=pd.DataFrame({"customer_id":[1,1,2,2],"date":pd.to_datetime(["2026-02-01","2026-01-10","2026-03-02","2026-02-20"])})\nprint(df.groupby("customer_id")["date"].min().reset_index())'],
            ['PY-P050','Calculate each product contribution to total revenue as a percentage.','Medium','import pandas as pd\ndf=pd.DataFrame({"product":["A","B","C"],"revenue":[100,300,600]})\ndf["pct_of_total"]=df["revenue"]/df["revenue"].sum()*100\nprint(df)'],
            ['PY-P051','Find the top product by revenue in each region.','Hard','import pandas as pd\ndf=pd.DataFrame({"region":["North","North","South","South"],"product":["A","B","A","B"],"revenue":[100,250,300,200]})\nidx=df.groupby("region")["revenue"].idxmax()\nprint(df.loc[idx])'],
            ['PY-P052','Compare current month sales with previous month sales by region.','Hard','import pandas as pd\ndf=pd.DataFrame({"region":["North","North","South","South"],"month":["2026-01","2026-02","2026-01","2026-02"],"sales":[100,130,200,180]})\ndf=df.sort_values(["region","month"])\ndf["previous_sales"]=df.groupby("region")["sales"].shift()\ndf["change_pct"]=(df["sales"]/df["previous_sales"]-1)*100\nprint(df)'],
            ['PY-P053','Find customers whose total order value is above the overall average customer value.','Hard','import pandas as pd\norders=pd.DataFrame({"customer_id":[1,1,2,3,3],"amount":[100,200,500,50,100]})\ncustomer_total=orders.groupby("customer_id",as_index=False)["amount"].sum()\ncutoff=customer_total["amount"].mean()\nprint(customer_total[customer_total["amount"]>cutoff])'],
            ['PY-P054','Detect a sudden sales drop when today is less than 70% of the previous day.','Medium','import pandas as pd\ndf=pd.DataFrame({"date":pd.date_range("2026-01-01",periods=5),"sales":[100,110,105,60,100]})\ndf["previous"]=df["sales"].shift()\nprint(df[df["sales"]<0.7*df["previous"]])'],
            ['PY-P055','Create a reusable function that validates required DataFrame columns.','Medium','import pandas as pd\ndef validate_columns(df,required):\n    missing=[c for c in required if c not in df.columns]\n    return missing\ndf=pd.DataFrame({"id":[1],"sales":[100]})\nprint(validate_columns(df,["id","sales","date"]))'],
            ['PY-P056','Use a custom function with groupby to calculate a sales range by department.','Hard','import pandas as pd\ndf=pd.DataFrame({"department":["IT","IT","HR"],"sales":[100,300,200]})\nresult=df.groupby("department")["sales"].agg(lambda x:x.max()-x.min())\nprint(result)'],
            ['PY-P057','Find rows where two columns disagree after a data migration.','Medium','import pandas as pd\ndf=pd.DataFrame({"old_value":[10,20,30],"new_value":[10,25,30]})\nprint(df[df["old_value"]!=df["new_value"]])'],
            ['PY-P058','Build a small data-quality report showing null count, duplicate count, and row count.','Hard','import pandas as pd\ndf=pd.DataFrame({"id":[1,2,2,3],"name":["A",None,"B","C"]})\nreport={"rows":len(df),"duplicate_rows":df.duplicated().sum(),"null_cells":df.isna().sum().sum()}\nprint(report)'],
            ['PY-P059','Process a large CSV in chunks and calculate total sales without loading all rows at once.','Hard','import pandas as pd\n# Replace the path with a real CSV path when running locally.\n# total=0\n# for chunk in pd.read_csv("sales.csv",usecols=["sales"],chunksize=100000):\n#     total += chunk["sales"].sum()\n# print(total)\nprint("Use pd.read_csv(..., chunksize=100000) and aggregate each chunk")'],
            ['PY-P060','Create a final KPI table with total revenue, unique customers, average order value, and conversion rate.','Hard','import pandas as pd\ndf=pd.DataFrame({"customer_id":[1,2,1,3],"revenue":[100,200,150,50],"visits":[10,20,15,5],"orders":[1,1,1,0]})\nkpi={"total_revenue":df["revenue"].sum(),"unique_customers":df["customer_id"].nunique(),"average_order_value":df["revenue"].sum()/df["orders"].sum(),"conversion_rate":df["orders"].sum()/df["visits"].sum()*100}\nprint(kpi)']
          ]

          theory = theory[:-1] + ',' + json.dumps(extra_theory, ensure_ascii=False)[1:]
          practical = practical[:-1] + ',' + json.dumps(extra_practical, ensure_ascii=False)[1:]

          prefix = old.split('<script>',1)[0]

          js = r'''<script>
          const theory=THEORY_DATA;
          const practical=PRACTICAL_DATA;
          let mode='theory', current=null;
          const $=id=>document.getElementById(id);
          const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          function list(){return mode==='theory'?theory:practical}
          function renderNav(){
            const search=($('search').value||'').toLowerCase().trim();
            const diff=$('difficulty').value;
            const arr=list().filter(q=>(!search||q[1].toLowerCase().includes(search)||q[0].toLowerCase().includes(search))&&(diff==='All'||q[2]===diff));
            $('stats').textContent=(mode==='theory'?'Theory: ':'Practical: ')+arr.length+' questions';
            $('nav').innerHTML='';
            if(!arr.length){current=null;$('page').innerHTML='<div class="card"><div class="question">No questions match your filter.</div><p class="meta">Try All difficulty or clear the search box.</p></div>';return;}
            arr.forEach(q=>{const b=document.createElement('button');b.className='qbtn'+(current===q[0]?' active':'');b.textContent=q[0]+' · '+q[1];b.onclick=()=>show(q[0]);$('nav').appendChild(b)});
            if(!arr.some(q=>q[0]===current))current=arr[0][0];
            show(current);
          }
          function show(id){
            const q=list().find(x=>x[0]===id); if(!q)return;
            current=id;
            document.querySelectorAll('.qbtn').forEach(b=>b.classList.toggle('active',b.textContent.startsWith(id+' · ')));
            $('title').textContent=q[0]+' · '+q[1];
            if(mode==='theory'){
              $('subtitle').textContent='Detailed Python and Pandas explanations in simple interview language.';
              $('page').innerHTML='<div class="card"><span class="badge">Python Theory</span><span class="badge">'+q[2]+'</span><div class="question">🐍 '+esc(q[1])+'</div></div><div class="card"><h3>💡 Detailed answer</h3><div class="answer">'+esc(q[3])+'</div></div><div class="card"><h3>🎯 Interview tip</h3><div class="tip">Explain the concept in simple words first, then give a short example. For Data Analyst interviews, connect the concept to data cleaning, transformation, automation, or analysis when relevant.</div></div>';
            }else{
              $('subtitle').textContent='Write Python first, run it, check your answer, then compare with the solution.';
              $('page').innerHTML='<div class="card"><span class="badge">Practical Python</span><span class="badge">'+q[2]+'</span><div class="question">🐍 '+esc(q[1])+'</div><p class="meta">Write your code before looking at the solution.</p></div><div class="card"><h3>🤔 Think first</h3><div class="hint">Identify the input, the transformation, and the expected output before coding.</div></div><div class="card"><h3>✍️ Write your Python</h3><textarea id="editor" class="editor"># Write your solution here</textarea><div class="buttons"><button class="btn run" id="runBtn">▶ Run Python</button><button class="btn check" id="checkBtn">✓ Check Answer</button><button class="btn show" id="showBtn">Show Correct Code</button><button class="btn clear" id="clearBtn">Clear</button></div><div id="result"></div></div><div class="card"><h3>💡 Solution</h3><pre class="code" id="solution">Click “Show Correct Code” when you are ready.</pre></div>';
              $('runBtn').onclick=runPython;$('checkBtn').onclick=checkPython;$('showBtn').onclick=showSolution;$('clearBtn').onclick=()=>{$('editor').value='';$('result').innerHTML=''};
            }
          }
          let pyodide=null, loading=null;
          async function getPyodide(){
            if(pyodide)return pyodide;
            if(!loading){loading=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js';s.onload=async()=>{try{pyodide=await loadPyodide();resolve(pyodide)}catch(e){reject(e)}};s.onerror=reject;document.head.appendChild(s)})}
            return loading;
          }
          async function runPython(){const out=$('result');out.innerHTML='<div class="result">Loading Python runtime...</div>';try{const p=await getPyodide();let output='';p.setStdout({batched:s=>output+=s});await p.runPythonAsync($('editor').value);out.innerHTML='<div class="result ok"><b>Output:</b><pre>'+esc(output||'(no printed output)')+'</pre></div>'}catch(e){out.innerHTML='<div class="result err"><b>Python error:</b><pre>'+esc(e.message||e)+'</pre></div>'}}
          function showSolution(){const q=practical.find(x=>x[0]===current);$('solution').textContent=q?q[3]:''}
          function norm(s){return String(s).replace(/\s+/g,' ').trim().toLowerCase()}
          async function checkPython(){const q=practical.find(x=>x[0]===current);if(!q)return;const out=$('result');out.innerHTML='<div class="result">Running your code to check the output...</div>';try{const p=await getPyodide();let user='';p.setStdout({batched:s=>user+=s});await p.runPythonAsync($('editor').value);let expected='';p.setStdout({batched:s=>expected+=s});await p.runPythonAsync(q[3]);const ok=norm(user)===norm(expected);out.innerHTML='<div class="result '+(ok?'ok':'err')+'">'+(ok?'✅ Correct output.':'❌ Output does not match the expected solution output. Compare your approach with the correct code.')+'</div>'}catch(e){out.innerHTML='<div class="result err">❌ '+esc(e.message||e)+'</div>'}}
          $('pythonTheoryTab').onclick=()=>{mode='theory';current=null;$('pythonTheoryTab').classList.add('active');$('pythonPracticeTab').classList.remove('active');$('search').value='';$('difficulty').value='All';renderNav()};
          $('pythonPracticeTab').onclick=()=>{mode='practice';current=null;$('pythonPracticeTab').classList.add('active');$('pythonTheoryTab').classList.remove('active');$('search').value='';$('difficulty').value='All';renderNav()};
          $('search').addEventListener('input',()=>{current=null;renderNav()});
          $('difficulty').addEventListener('change',()=>{current=null;renderNav()});
          renderNav();
          </script>'''
          js = js.replace('THEORY_DATA', theory).replace('PRACTICAL_DATA', practical)
          p.write_text(prefix + js + '</body></html>\n', encoding='utf-8')
          print('Python bank rebuilt:', len(extra_theory), 'new theory and', len(extra_practical), 'new practical questions')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add python_practice.html
          git add .github/workflows/build-python-question-bank.yml
          git diff --cached --quiet || git commit -m 'Add complete Python interview question bank [skip ci]'
          git push