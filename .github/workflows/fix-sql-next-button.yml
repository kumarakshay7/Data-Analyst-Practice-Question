name: Fix SQL Next Button

on:
  push:
    branches: [main]
    paths:
      - 'sql_next_button.js'
      - 'tools/fix_sql_next_button.py'
      - '.github/workflows/fix-sql-next-button.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch SQL practice page
        run: python tools/fix_sql_next_button.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add practice.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Add Next button to SQL practice page'
            git push
          fi
