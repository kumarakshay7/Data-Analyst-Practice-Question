name: Deploy SQL Practice to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Apply Data Analyst Practice heading]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Python practice page before deployment
        run: python3 tools/fix_python_page.py

      - name: Repair Python sample-input JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('python_practice.html')
          s=p.read_text(encoding='utf-8')
          helper="""function sampleInput(code){
            const lines=code.split(String.fromCharCode(10)).filter(x=>x.trim()&&!x.trim().startsWith('#'));
            const defs=[];
            for(const line of lines){
              const t=line.trim();
              if(!/^[A-Za-z_][A-Za-z0-9_]*\\s*=\\s*/.test(t)) continue;
              if(/^(previous|change|change_pct|running_total|rolling_avg|pct_change|rank|year|month|revenue|dept_avg|idx|iqr|cutoff|customer_total|x|report|kpi|missing|result|total)\\s*=/.test(t)) continue;
              defs.push(t); if(defs.length>=4) break;
            }
            return defs.length?defs.join(String.fromCharCode(10)):'Use the exact sample data shown in the solution.';
          }
          """
          s=re.sub(r'function sampleInput\(code\)\{.*?\n\}\nasync function runPython', helper+'async function runPython', s, count=1, flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate site files
        run: |
          test -f index.html
          test -f all_questions.html
          test -f practice.html
          test -f python_practice.html
          test -f QUESTION_BANK.md
          test -f theory_details.js
          test -f theory_extra.js
          test -f datasets/practice_seed.sql
          echo "GitHub Pages files validated."

      - name: Attach detailed theory explanations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('practice.html')
          html = path.read_text(encoding='utf-8')
          marker = '<!-- THEORY_DETAILS_ATTACHED -->'
          if marker not in html:
              html = html.replace('</body>', marker + '<script src="theory_details.js"></script><script src="theory_extra.js"></script></body>')
              path.write_text(html, encoding='utf-8')
          print('Detailed theory scripts attached for GitHub Pages deployment.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
