name: Deploy SQL Practice to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix SQL runner
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("practice.html")
          html = path.read_text(encoding="utf-8")

          replacement = r'''let sqlPromise=null,dbCache=new Map(),runToken=0;
          async function getSQL(){
            if(!sqlPromise){
              sqlPromise=initSqlJs({locateFile:file=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'+file});
            }
            const SQL=await sqlPromise;
            if(!SQL || typeof SQL.Database!=='function') throw new Error('SQL engine failed to initialize. Please refresh the page.');
            return SQL;
          }
          async function getQuestionDb(questionIndex){
            if(dbCache.has(questionIndex)) return dbCache.get(questionIndex);
            const SQL=await getSQL();
            const questionDb=new SQL.Database();
            questionDb.run(Q[questionIndex].setup);
            dbCache.set(questionIndex,questionDb);
            return questionDb;
          }
          async function execute(sql){
            if(!sql.trim())throw new Error('Please write a SQL query first.');
            const questionDb=await getQuestionDb(current);
            return questionDb.exec(sql);
          }
          async function runSQL(){
            const token=++runToken,box=document.getElementById('result');
            box.innerHTML='<div class="notice">⏳ Running your SQL...</div>';
            try{
              const sql=document.getElementById('editor').value;
              const r=await execute(sql);
              if(token!==runToken)return;
              if(!r.length){box.innerHTML='<div class="success">✅ Query executed successfully, but it returned no rows.</div>';return}
              box.innerHTML='<div class="success">✅ Query executed successfully.</div><div class="result">'+table(r[0].values,r[0].columns)+'</div>';
            }catch(e){if(token===runToken)box.innerHTML='<div class="error">❌ SQL Error<br><br>'+esc(e.message)+'</div>'}
          }
          async function checkAnswer(){
            const token=++runToken,box=document.getElementById('result');
            box.innerHTML='<div class="notice">⏳ Checking your answer...</div>';
            try{
              const sql=document.getElementById('editor').value;
              const r=await execute(sql);
              if(token!==runToken)return;
              const actual=normRows(r.length?r[0].values:[]),expected=normRows(Q[current].out);
              if(JSON.stringify(actual)===JSON.stringify(expected)){
                if(!completed.includes(Q[current].id)){completed.push(Q[current].id);localStorage.setItem('sqlPracticeCompleted',JSON.stringify(completed))}
                box.innerHTML='<div class="success">✅ Correct! Your result matches the expected output.</div>';
                renderNav();document.getElementById('bar').style.width=(completed.length/Q.length*100)+'%';document.getElementById('progress').textContent=completed.length+' / '+Q.length+' completed';
              }else{
                box.innerHTML='<div class="error">❌ Wrong answer. Your query ran successfully, but the result does not match the expected output.<br><br><b>Try again or use Hint 1 / Hint 2.</b></div>';
              }
            }catch(e){if(token===runToken)box.innerHTML='<div class="error">❌ SQL Error<br><br>'+esc(e.message)+'</div>'}
          }
          '''

          pattern = r"async function initDB\(x\).*?function showSolution\(\)\{"
          updated, count = re.subn(pattern, replacement + "function showSolution(){", html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not find the SQL runner block in practice.html")
          path.write_text(updated, encoding="utf-8")
          print("SQL runner patched: database is reused for repeated Run SQL / Check Answer clicks")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
