name: Deploy SQL Practice to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site files
        run: |
          test -f index.html
          test -f all_questions.html
          test -f practice.html
          test -f QUESTION_BANK.md
          test -f theory_details.js
          echo "GitHub Pages files validated."

      - name: Repair Practical SQL page JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('practice.html')
          s = p.read_text(encoding='utf-8')
          broken = 't.split(/\\r?\n/)'
          fixed = r't.split(/\r?\n/)'
          if broken in s:
              s = s.replace(broken, fixed)
              p.write_text(s, encoding='utf-8')
              print('Fixed malformed QUESTION_BANK.md line-splitting regex.')
          else:
              print('Regex already fixed or pattern not present.')
          PY

      - name: Add detailed theory explanations
        run: |
          sed -i '/<\/body>/i <script src="theory_details.js"><\/script>' practice.html
          echo "Detailed theory explanations loaded."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
