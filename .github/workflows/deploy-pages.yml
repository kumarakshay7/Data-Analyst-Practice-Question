name: Deploy SQL Practice to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site files
        run: |
          test -f index.html
          test -f all_questions.html
          test -f practice.html
          test -f QUESTION_BANK.md
          test -f theory_details.js
          test -f datasets/practice_seed.sql
          echo "GitHub Pages files validated."

      - name: Repair Practical SQL question loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('practice.html')
          html = path.read_text(encoding='utf-8')

          loader = r'''fetch('QUESTION_BANK.md')
          .then(response => {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.text();
          })
          .then(text => {
            BANK = [];
            for (const line of text.split(/\r?\n/)) {
              const match = line.match(/^\s*(\d+)\.\s+(.+)$/);
              if (match && Number(match[1]) <= 155) {
                BANK.push({
                  n: Number(match[1]),
                  id: 'Q' + String(match[1]).padStart(3, '0'),
                  title: match[2].trim(),
                  difficulty: diff(Number(match[1]))
                });
              }
            }
            render();
          })
          .catch(error => {
            document.getElementById('stats').textContent = 'Unable to load question bank';
            document.getElementById('page').innerHTML = '<div class="card"><div class="result err">❌ Could not load QUESTION_BANK.md. Please refresh the page.</div></div>';
            console.error(error);
          });
          </script>'''

          pattern = r"fetch\('QUESTION_BANK\.md'\)[\s\S]*?</script>"
          if not re.search(pattern, html):
              raise SystemExit('QUESTION_BANK.md loader was not found in practice.html')

          html = re.sub(pattern, lambda _match: loader, html, count=1)
          path.write_text(html, encoding='utf-8')
          print('Practical SQL loader repaired successfully.')
          PY

      - name: Initialize Practical SQL database
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('practice.html')
          html = path.read_text(encoding='utf-8')

          marker = '<script id="practice-db-fix">'
          if marker in html:
              print('Database initializer already present.')
              raise SystemExit(0)

          script = r'''<script id="practice-db-fix">
          (function () {
            const seedUrl = 'datasets/practice_seed.sql';
            const sqlJsUrl = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js';

            async function initializePracticeDatabase() {
              if (window.DB) return window.DB;
              if (!window.initSqlJs) {
                throw new Error('SQL.js has not loaded yet. Please refresh the page.');
              }
              window.SQL = await window.initSqlJs({
                locateFile: file => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/' + file
              });
              window.DB = new window.SQL.Database();
              const response = await fetch(seedUrl);
              if (!response.ok) throw new Error('Could not load practice dataset: HTTP ' + response.status);
              window.DB.run(await response.text());
              return window.DB;
            }

            window.practiceDbReady = initializePracticeDatabase();

            const originalRunSql = window.runSql;
            window.runSql = async function () {
              try {
                await window.practiceDbReady;
                return originalRunSql();
              } catch (e) {
                msg(e.message || String(e));
              }
            };

            const originalCheckSql = window.checkSql;
            window.checkSql = async function () {
              try {
                await window.practiceDbReady;
                return originalCheckSql();
              } catch (e) {
                msg(e.message || String(e));
              }
            };
          })();
          </script>'''

          html = html.replace('</body>', script + '</body>')
          path.write_text(html, encoding='utf-8')
          print('Practical SQL database initializer added.')
          PY

      - name: Add detailed theory explanations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('practice.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="theory_details.js"></script>'
          if tag not in html:
              html = html.replace('</body>', tag + '</body>')
              path.write_text(html, encoding='utf-8')
          print('Theory details ready.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
