name: Deploy SQL Practice to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site files
        run: |
          test -f index.html
          test -f all_questions.html
          test -f practice.html
          test -f QUESTION_BANK.md
          test -f theory_details.js
          echo "GitHub Pages files validated."

      - name: Repair Practical SQL question loader
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('practice.html')
          s = p.read_text(encoding='utf-8')
          loader = r'''fetch('QUESTION_BANK.md').then(r=>r.text()).then(t=>{
          BANK=[];
          for(const l of t.split(/\r?\n/)){
            const m=l.match(/^\s*(\d+)\.\s+(.+)$/);
            if(m && +m[1] <= 155){
              BANK.push({n:+m[1],id:'Q'+String(m[1]).padStart(3,'0'),title:m[2].trim(),difficulty:diff(+m[1])});
            }
          }
          render();
          }).catch(e=>{
            document.getElementById('stats').textContent='Unable to load question bank';
            document.getElementById('page').innerHTML='<div class="card"><div class="result err">❌ Could not load QUESTION_BANK.md. Please refresh the page.</div></div>';
            console.error(e);
          });</script>'''
          pattern = r"fetch\('QUESTION_BANK\.md'\)[\s\S]*?</script>"
          if re.search(pattern, s):
              s = re.sub(pattern, loader, s, count=1)
              p.write_text(s, encoding='utf-8')
              print('Replaced the malformed question-bank loader with valid JavaScript.')
          else:
              raise SystemExit('Could not find QUESTION_BANK.md loader in practice.html')
          PY

      - name: Add detailed theory explanations
        run: |
          sed -i '/<\/body>/i <script src="theory_details.js"><\/script>' practice.html
          echo "Detailed theory explanations loaded."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
