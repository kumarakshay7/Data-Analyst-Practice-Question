name: Deploy SQL Practice to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Apply Data Analyst Practice heading]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site files
        run: |
          test -f index.html
          test -f all_questions.html
          test -f practice.html
          test -f python_practice.html
          test -f QUESTION_BANK.md
          test -f theory_details.js
          test -f theory_extra.js
          test -f datasets/practice_seed.sql
          echo "GitHub Pages files validated."

      - name: Attach detailed theory explanations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('practice.html')
          html = path.read_text(encoding='utf-8')
          marker = '<!-- THEORY_DETAILS_ATTACHED -->'
          if marker not in html:
              html = html.replace('</body>', marker + '<script src="theory_details.js"></script><script src="theory_extra.js"></script></body>')
              path.write_text(html, encoding='utf-8')
          print('Detailed theory scripts attached for GitHub Pages deployment.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
