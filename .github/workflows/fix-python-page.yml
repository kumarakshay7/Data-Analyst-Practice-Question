name: Update Python Practice Page
on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_python_page.py'
      - 'python_practice.html'
      - '.github/workflows/fix-python-page.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Python page
        run: python tools/fix_python_page.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add python_practice.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Fix Python practice samples and detailed theory [skip ci]'
            git push
          fi
